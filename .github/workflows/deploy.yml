# One environment, one digest, over SSH.
#
# Called twice: by ci.yml for staging on every merge, and by promote.yml or
# rollback.yml for production. There is one copy of the SSH handling because
# there is one way to reach the server, and two copies would be two places for
# a `StrictHostKeyChecking=no` to appear in a hurry.
#
# What this workflow does NOT do is decide anything. It hands the server a
# digest and a commit sha and reads back the summary; every check, every
# ordering rule and the whole rollback path live in deploy/host/deploy.sh,
# which is version-controlled and is copied up from THIS commit before it runs.
# A deploy script that lives only on the server is a script nobody reviews.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string
      digest:
        description: the image digest to deploy, sha256:…
        required: true
        type: string
      expected_sha:
        description: the full 40-character commit the digest was built from
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment is what carries the secrets: staging's host and key are
    # not reachable from a production deploy and the reverse. It is also where
    # a required reviewer goes the day this repository can have one.
    environment: ${{ inputs.environment }}
    # One deploy per environment at a time, and a newer commit QUEUES rather
    # than cancelling. Cancelling mid-deploy is how a half-migrated database
    # meets a half-replaced set of containers.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      # Checked HERE, not in the callers.
      #
      # `rollback.yml` declares `environment` as a choice and both callers
      # match the revision against 40 hex characters, so today every value
      # arriving is already well formed. But that is a property of the callers,
      # and this workflow is `workflow_call` — the next caller is whoever adds
      # one. These three values are interpolated into a command that runs as
      # the deploy user on the host holding the shop's database, so the shape
      # of each is asserted where it is used rather than where it came from.
      - name: The inputs are what they claim to be
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            staging | production) ;;
            *) echo "environment must be staging or production" >&2; exit 1 ;;
          esac
          echo "$EXPECTED_SHA" | grep -qE '^[0-9a-f]{40}$' ||
            { echo "expected_sha is not a full 40-character commit sha" >&2; exit 1; }
          echo "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$' ||
            { echo "digest is not a sha256 digest" >&2; exit 1; }

      # At the deployed commit, not at the branch tip: the script that runs
      # must be the one from the commit being deployed.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      # The key never appears in a command line — an argument is visible in
      # `ps` to every process on the runner. `install -m 600` creates the file
      # unreadable by anyone else before a byte of it is written.
      #
      # known_hosts is pinned from a secret. No `ssh-keyscan` here: keyscanning
      # at deploy time is trust-on-first-use every single time, which is not
      # verification, it is the shape of verification.
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER_: ${{ secrets.DEPLOY_USER }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # Every one of these, by name, before anything is written.
          #
          # This used to be `test -s ~/.ssh/deploy_key` after the write, which
          # proved nothing: `printf '%s\n' ""` puts a newline in the file, so an
          # EMPTY secret produces a one-byte file and passes. The first real
          # deploy ran with all five secrets empty and got as far as
          # `scp: bad port ""` before anything noticed.
          missing=
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS HOST PORT USER_; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "empty or unset secrets:$missing" >&2
            echo "the environment '$ENVIRONMENT' must define DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS, and the calling job must pass them with \`secrets: inherit\`" >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Send the deploy script
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER_: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -P "$PORT" -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/host/deploy.sh "$USER_@$HOST:/opt/shikoo/"
          ssh -p "$PORT" -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_@$HOST" 'chmod 0755 /opt/shikoo/deploy.sh'

      # The digest and the commit sha are not secrets — they are a fingerprint
      # of a private repository, the same reasoning that keeps ingest's
      # /version public. They can safely be arguments; the credentials cannot,
      # and are not.
      #
      # Every value reaches the shell as an environment variable rather than as
      # `${{ }}` inside the command string. A template expansion is pasted in
      # before bash ever sees the line, so a value carrying a quote or a
      # semicolon would stop being an argument and start being code — running
      # as the deploy user, on the host that holds the shop's database. The
      # variables are also what makes the single-quote wrapping unnecessary,
      # which was its own small bug: a value containing `'` broke the command.
      - name: Deploy
        id: run
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER_: ${{ secrets.DEPLOY_USER }}
          ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          # A registry path may not contain uppercase and this repository's
          # name does, so `github.repository` cannot be used verbatim.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST"
          ssh -p "$PORT" -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_@$HOST" \
            /opt/shikoo/deploy.sh "$ENVIRONMENT" "$IMAGE" "$EXPECTED_SHA" \
            2>&1 | tee deploy.log

      # Written whether the deploy passed or failed — a failed deploy is when
      # the verdict line matters most, because it says whether the rollback
      # worked. Only the SUMMARY: lines the script prints deliberately; the
      # full log stays in the job output.
      - name: Report
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "### Deploy — $ENVIRONMENT"
            echo ""
            if [ -f deploy.log ]; then
              grep '^SUMMARY: ' deploy.log | sed 's/^SUMMARY: /- /' || echo "- no summary was produced"
            else
              echo "- the deploy step did not run"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
