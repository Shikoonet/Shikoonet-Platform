# Green `main` → one image → the complete staging environment.
#
# ══════════════════════════════════════════════════════════════════════════
# THIS WORKFLOW CANNOT REACH PRODUCTION
# ══════════════════════════════════════════════════════════════════════════
#
# It has no `production` job and no production environment, so no repository
# variable, no `if:` and no edit to a settings page can turn a merge into a
# production deploy. Production lives in `promote-production.yml`, behind
# `workflow_dispatch`, and reaching it requires a person.
#
# That is the structural half of a promise the previous design made with a
# repository variable: `production` used to be a job gated on an exact-string
# comparison against one, which meant re-creating that variable in a settings
# page re-enabled automatic production deployment — no diff, no review. Deleting
# the job removes the switch rather than leaving it off. The deploy test greps
# both workflows for that variable's name, so it cannot come back even as prose.
#
# ── Why `workflow_run` and why three conditions ────────────────────────────
#
# `workflow_run` is the only trigger that can say "after CI passed", and it
# runs with write scope, so it must refuse everything it did not mean:
#
#   conclusion == 'success'    cancelled and skipped are not passes
#   event      == 'push'       a CI run FROM A PULL REQUEST must never deploy;
#                              a fork PR's run completing is attacker-triggerable
#   head_branch == 'main'      belt to the `branches:` filter
#
# and it builds `github.event.workflow_run.head_sha` explicitly — never a
# default checkout, which on this trigger is the branch tip and may already be
# a commit nothing has tested.
#
# ── Why the manual trigger takes NO inputs ─────────────────────────────────
#
# `workflow_dispatch` exists so that redeploying current `main` — after a
# Coolify variable was fixed, or to roll the bot out — does not require an
# empty commit pushed purely to make `workflow_run` fire. That worked, and it
# wrote a lie into the history of a repository whose entire deployment story is
# provenance.
#
# It accepts no sha, no digest, no image, no ref and no run id. An input naming
# the artifact would hand the answer to whoever pressed the button, and every
# guard downstream exists to prove that what ships is what was reviewed. The
# workflow resolves `refs/heads/main` on the server, `require-ci-run.sh` refuses
# it unless CI already passed on that exact sha as a push to main, and the same
# `approval-gate.sh` then runs unchanged — including its branch-race re-read,
# which is what refuses a sha that stopped being main while this was thinking.
#
# The deploy test asserts the absence of those inputs textually, so adding one
# back is a red build rather than a review someone skimmed.

name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Deliberately empty. See the header: no sha, no digest, no image, no ref,
  # no run id. Adding `inputs:` here is what the deploy test greps for.
  workflow_dispatch:

permissions:
  contents: read

# ONE group, shared with `promote-production.yml` — see the note there. A
# staging deploy and a promotion must never overlap: they write and read the
# same ledger and take the same flock on the box.
concurrency:
  group: shikoo-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/shikoonet/shikoonet-platform
  DEPLOY_APPROVAL_MODE: owner-or-approved
  # The people trusted to ship their own work to STAGING without a human
  # review. Production is NOT widened by this: each production workflow sets
  # its own SOLO_DEPLOY_OWNER and compares github.actor against it directly,
  # so promotion remains one person. See deploy/README.md.
  #
  # (Those workflow filenames are deliberately not written here: a test asserts
  # this file never names them, so that staging can never grow a reference to
  # the production path.)
  #
  # A list because a two-person team cannot satisfy "approved by somebody other
  # than the author" without that somebody being the owner — so every
  # contributor PR needed the owner twice, once to review and once to merge.
  DEPLOY_OWNERS: Isusami,arshiajacki

jobs:
  gate:
    name: gate
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ci_run_id: ${{ steps.resolve.outputs.ci_run_id }}
      policy: ${{ steps.gate.outputs.policy }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      # A dispatch from any branch but main is refused before a checkout, a
      # token or an API call. `workflow_dispatch` offers a branch picker and
      # there is no setting that removes it, so this is the only place the
      # restriction can live.
      - name: a manual redeploy runs from main or not at all
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -Eeuo pipefail
          REF='${{ github.ref }}'
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "::error::Deploy Staging runs from refs/heads/main; this dispatch came from «${REF}»"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit CI passed, explicitly. Never the default ref.
          #
          # On a dispatch the event carries no sha, so `main` is checked out
          # whole — full history, because the sha is resolved from the ref
          # below rather than taken from anything the dispatcher typed.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          persist-credentials: false

      # The sha, decided here and nowhere else.
      - id: resolve
        name: resolve the commit to deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            # From the ref, not from an input. `git rev-parse` on the checkout
            # this workflow just made, so there is no field a dispatcher can
            # fill in that reaches this line.
            SHA=$(git rev-parse refs/heads/main)
            echo "sha=${SHA}" >>"$GITHUB_OUTPUT"
            # And it only counts if CI already passed on it, as a push, on
            # main — the fact `workflow_run` supplies for free on the
            # automatic path and that a dispatch has to go and ask for.
            bash deploy/require-ci-run.sh "${{ github.repository }}" "$SHA"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >>"$GITHUB_OUTPUT"
            echo "ci_run_id=${{ github.event.workflow_run.id }}" >>"$GITHUB_OUTPUT"
          fi

      - id: gate
        name: approval provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_APPROVAL_MODE: ${{ env.DEPLOY_APPROVAL_MODE }}
          DEPLOY_OWNERS: ${{ env.DEPLOY_OWNERS }}
        run: bash deploy/approval-gate.sh "${{ github.repository }}" "${{ steps.resolve.outputs.sha }}"

      - name: say which policy allowed this, in the run summary
        run: |
          set -Eeuo pipefail
          {
            echo "## Deployment approval"
            echo
            echo "- policy: **${{ steps.gate.outputs.policy }}**"
            echo "- pull request: #${{ steps.gate.outputs.pr_number }}"
            echo "- non-author human approvals: ${{ steps.gate.outputs.approvals }}"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ needs.gate.outputs.sha }}
          # `deploy.sh` reads this label back off the pulled image and refuses
          # the deploy when it is not the commit it was asked for. It is the
          # whole of what stops a digest built from another tree reaching an
          # application record, so it is not decoration.
          labels: org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
          # No layer cache at all. See the header: a shared build cache is
          # writable by pull request runs, which need no approval to start.
          no-cache: true
          provenance: false

  staging:
    name: staging
    needs: [gate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The token this job hands to the server on stdin is what `docker pull`
      # authenticates with. Without `packages: read` it logs in successfully and
      # then cannot read a thing — «installation not allowed to Read
      # organization package», on a digest this same workflow pushed a minute
      # earlier. Granting the package access to the repository is NOT enough on
      # its own: the job's token has to carry the scope too.
      packages: read
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          SHA: ${{ needs.gate.outputs.sha }}
          # Off unless somebody turned it on, and turning it on is a repository
          # variable rather than an edit here — so the first staging bot rollout
          # is not a pull request, and turning it back off is not either.
          #
          # It stays off by default because the failure it guards against is not
          # a broken staging bot: it is a SECOND poller on the shop's real
          # token. Telegram hands each update to one getUpdates caller, so a
          # staging bot holding the production token silently takes messages
          # away from the bot customers are talking to. Before setting this,
          # the staging application's TELEGRAM_BOT_TOKEN has to be a bot of its
          # own. Nothing can check that from outside without reading a token, so
          # it is the owner's judgement until the bot boots — after which it has
          # written its own @username down and the two databases can be
          # compared. `docs/RELEASE.md` §2 is the procedure.
          #
          # Pass the value through unchanged. GitHub expression comparisons are
          # case-insensitive, so normalising it here would make TRUE and True
          # indistinguishable from the one accepted value. `deploy.sh` owns the
          # exact, case-sensitive comparison: only lowercase `true` is on.
          DEPLOY_BOT_ENABLED: ${{ vars.STAGING_BOT_ENABLED }}
          # Carried to the box so the deploy ledger records WHICH policy let
          # this out — «solo-owner» is not the same fact as «team-approved».
          DEPLOY_APPROVAL_POLICY: ${{ needs.gate.outputs.policy }}
        run: bash deploy/over-ssh.sh staging

      # The release manifest: what staging actually ran, and the evidence.
      #
      # It exists only because the deploy step above SUCCEEDED — `deploy.sh`
      # migrates, deploys and smoke-tests before this line is reached — so the
      # manifest's existence is itself the acceptance evidence, not a claim
      # written alongside one.
      #
      # `digest` and `sha` are kept as their own files for the promotion path
      # that reads them directly; the manifest is the richer record.
      - name: write the release manifest
        env:
          MAIN_SHA: ${{ needs.gate.outputs.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
          POLICY: ${{ needs.gate.outputs.policy }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          # The CI run that actually gated this deploy — the `workflow_run`
          # that triggered it, or the run `require-ci-run.sh` found for a
          # manual redeploy. Not this workflow's own id, which is what the
          # field used to fall back to and therefore never recorded.
          CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
        run: bash deploy/write-release-manifest.sh out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-digest
          path: out/
          retention-days: 30
