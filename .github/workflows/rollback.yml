# Put a previously published image back, in either environment.
#
# Deliberately does NOT check that the digest is what staging is running —
# that check exists in promote.yml to stop an untested image going forward,
# and applying it here would block the one deploy you make while something is
# already wrong. This is the same reasoning that makes the schema gate WARN
# rather than refuse when the database is ahead of the image.
#
# The database is never rolled back, by this or by anything else. Migrations
# are additive, so an older image runs on a newer schema; a schema rollback in
# a system holding payments is a data-loss decision and belongs to a person.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: which environment to put the image back in
        required: true
        type: choice
        options: [staging, production]
      image:
        description: 'the digest to go back to (sha256:…) or its commit sha — /var/lib/shikoo/<env>/deployed is the history'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.r.outputs.digest }}
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: r
        env:
          INPUT: ${{ inputs.image }}
        run: |
          set -euo pipefail
          # A registry path may not contain uppercase and this repository's
          # name does, so `github.repository` cannot be used verbatim.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "$INPUT" in
            sha256:*)
              # Checked, not merely prefixed: this value ends up in a remote
              # command and in a grep over the deploy history.
              echo "$INPUT" | grep -qE '^sha256:[0-9a-f]{64}$' ||
                { echo "not a sha256 digest" >&2; exit 1; }
              digest=$INPUT
              ;;
            *)
              if ! echo "$INPUT" | grep -qE '^[0-9a-f]{40}$'; then
                echo "input is neither a sha256: digest nor a 40-character commit sha" >&2
                exit 1
              fi
              digest=$(docker buildx imagetools inspect "$IMAGE:sha-$INPUT" --format '{{.Manifest.Digest}}')
              ;;
          esac
          sha=$(docker buildx imagetools inspect "$IMAGE@$digest" \
            --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')
          if ! echo "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "that image carries no usable org.opencontainers.image.revision label" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  rollback:
    needs: resolve
    # `secrets: inherit` is required, and this was learned the hard way: it was
    # removed on the reasoning that the called job declares the environment and
    # so resolves its own environment secrets. That reasoning is wrong. A
    # reusable workflow's `secrets` context is populated by the CALLER — without
    # `inherit` every one of them is the empty string, and the first real deploy
    # failed with `scp: bad port ""`.
    #
    # zizmor flags this as passing more than is needed, and it is right in
    # general. Here there is nothing else to pass: this repository has no
    # repository-level secrets at all, so `inherit` hands over exactly the five
    # environment secrets the deploy needs.
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      digest: ${{ needs.resolve.outputs.digest }}
      expected_sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit # zizmor: ignore[secrets-inherit]
