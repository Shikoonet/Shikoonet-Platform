name: CI

# Required Pull Request quality gate.
#
# `Required Quality Gate` is the ONE check a ruleset should require. Everything
# above it is diagnostic — those names say *why*; this one says *whether*.
#
# ## The shape, and why it changed on 2026-08-27
#
# It used to be six jobs, one of which — `gate` — did almost everything in a
# straight line: apply migrations, prove the invariants, run the entire test
# suite for all ten packages one package at a time, re-run three of them for
# coverage, then build the Docker image and poke at it. Measured over the five
# most recent successful runs it took a median of 5m18s while every other job
# finished inside 3m15s, so the whole pipeline was as slow as its slowest
# straight line and five runners sat idle waiting for it.
#
# Nothing in that line NEEDED to be in one job. It was in one job because the
# packages share a Postgres, and one job is the cheapest way to have one
# Postgres. Give each shard its own Postgres and the constraint disappears:
#
#   unit          contracts, sms-parser, admin-web — no database at all
#   db-shard hub       dashboard-worker, db, seed        own Postgres
#   db-shard services  bot, ingest-worker, domain        own Postgres
#   migrations    clean database → migrations → invariants → migrate suite,
#                 then the image checks, which need a database and nothing else
#   e2e           own Postgres, seed:sim, the browser walk
#
# The shards are balanced on MEASURED runtime taken from run 33105968752's own
# log, not on package count:
#
#   dashboard 67.4s  db  4.9s  seed 1.7s   → hub       74.0s
#   bot       42.8s  ingest 17.2s  domain 12.7s → services  72.7s
#
# ## What is NOT parallel, and must not become parallel
#
# `--workspace-concurrency=1` is still passed inside every shard, and every
# database-backed package still carries `fileParallelism: false`. The packages
# in one shard share that shard's single database and TRUNCATE between files.
# Sharding made the SHARDS safe to run at once by giving each one its own
# Postgres; it changed nothing about what is safe *inside* one. See the header
# of `tools/ci-run-tests.sh`.
#
# Playwright likewise keeps `workers: 1`: its specs write shop-wide rows and
# assert on them, so two workers would be two admins editing one setting.
#
# ## Two duplicated units of work that are now done once
#
#   - the three coverage-gated packages used to run twice, once inside
#     `pnpm test` and again under `pnpm coverage`. They now run once, with
#     `--coverage`, in whichever shard owns them. The floors are unchanged and
#     are enforced twice: by vitest in the shard, and again by
#     `tools/ci-verify-gate.ts` in the aggregator against the merged summaries.
#   - `apps/dashboard-worker`'s `e2e` script rebuilds the admin SPA, which the
#     `e2e` job had already built in its own step. The job now calls
#     `playwright test` directly, after the build it does itself.
#
# ## The aggregator no longer trusts a green matrix
#
# A shard whose filter matched nothing exits 0. A matrix trimmed from two
# entries to one leaves nothing behind to notice. So every test job uploads a
# machine-readable report and `Required Quality Gate` checks them against
# `.github/ci-baseline.json`: every expected suite present, no test count down,
# no skip count up, every coverage summary present and clearing its floor, the
# Playwright report complete, the migration and invariant counts intact.
#
# Triggers:
#   - pull_request (opened, synchronize, reopened, ready_for_review)
#   - merge_group, so it survives GitHub Merge Queue
#   - workflow_dispatch, for re-runs on demand
#   - push to main, so a direct push does not silently miss the gate
#
# Concurrency:
#   - one running workflow per PR (or per ref for direct pushes). The group is
#     keyed on the PR number for pull_request and on the ref otherwise, so the
#     two namespaces are disjoint and a PR run can never cancel a `main` run or
#     a deployment.
#   - `cancel-in-progress` is true ONLY for pull_request.
#
# Permissions:
#   - default `contents: read` at the workflow level
#   - per-job overrides only where strictly necessary
#
# Branch protection:
#   - cannot be enforced on this repo today. The stable aggregator is what a
#     future ruleset should require. Until then, a green aggregator is the
#     closest thing to a gate.
#
# CodeRabbit:
#   - reviewer at the App level, configured by `.coderabbit.yaml`, comments
#     on every PR. Not one of the required jobs. A CodeRabbit comment is
#     advisory, never blocking.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Fast static checks. Four independent jobs, all starting at t=0, none of
  # them a dependency of anything expensive — a slow linter must never be the
  # reason a test shard has not started.
  # -----------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  # -----------------------------------------------------------------------
  # Architectural boundaries the codebase has chosen. Eight rules:
  #
  #   1. `packages/domain` takes I/O by injection only — no `node:fs`,
  #      `node:net`, `node:http`, `child_process`, `pg`, `@shikoo/db`.
  #      `node:crypto` is allowed: it is the seal and the TOTP, not I/O.
  #   2. `packages/contracts` is pure — it reaches the browser bundle.
  #   3. `packages/database` holds SQL as constants, never executes one.
  #   4. No package imports an application.
  #   5. The SPA never imports the database layer.
  #   6. SQL does not grow in the SPA or in contracts.
  #   7. Cloudflare Workers/D1/Wrangler cannot be reintroduced.
  #   8. `legacy/` is never imported into production code.
  #
  # AST-based, through the TypeScript compiler API — see the header of
  # `tools/architecture-boundaries.ts` for why a grep could not do this and
  # for the two false positives that shaped the SQL rule.
  # -----------------------------------------------------------------------
  arch:
    name: arch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Architectural boundary check
        # AST-based, through the TypeScript compiler API that is already a
        # devDependency. `tsx` is a real runtime dependency of every app, so
        # this needs no build step. Reports EVERY violation in one run rather
        # than exiting on the first, so a branch that broke four boundaries
        # takes one round trip to find out instead of four.
        run: pnpm exec tsx tools/architecture-boundaries.ts

  # -----------------------------------------------------------------------
  # The suites that touch no database, no network and no shared process
  # state, so they need no service container and no serial rule between them.
  #
  # Isolation is a property of the packages, not an assumption:
  #   - `packages/contracts` is pure by architecture rule 2, which `arch`
  #     enforces on every run — it reaches the browser bundle.
  #   - `packages/sms-parser` is a string parser over fixtures.
  #   - `apps/admin-web` runs in happy-dom, in-process, with no server.
  # None of the three has a `DATABASE_URL` in its vitest config, and none has
  # a setup file that resets anything shared — the three database-backed apps
  # all do, which is exactly what puts them in a db-shard instead.
  #
  # `contracts` and `sms-parser` run under `--coverage` here because their
  # floors live in `vitest.coverage.ts`. That replaces their half of the old
  # separate `pnpm coverage` step rather than adding to it.
  # -----------------------------------------------------------------------
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: No database is reachable from this job
        # The claim this job rests on, asserted rather than assumed. If one of
        # these three ever grows a database dependency, it fails here with the
        # reason instead of passing because a connection happened to work.
        run: |
          set -Eeuo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            echo '::error::the unit job must not carry a DATABASE_URL'
            exit 1
          fi
          echo 'unit shard: no service containers, no DATABASE_URL'

      - name: Pure suites
        run: bash tools/ci-run-tests.sh '@shikoo/admin-web' '@shikoo/contracts @shikoo/sms-parser'

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: reports-unit
          # `coverage-summary.json` only — percentages and counts per file. The
          # HTML report embeds the SOURCE, which would put the whole private
          # codebase in a downloadable artifact.
          path: |
            packages/*/vitest-report.json
            apps/*/vitest-report.json
            packages/*/coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # The database-backed suites, in two shards balanced on measured runtime.
  #
  # EACH SHARD GETS ITS OWN POSTGRES. Not its own database on a shared server
  # — its own container, on its own runner VM, reachable only from that VM's
  # loopback. Two shards cannot see each other's data because they cannot
  # reach each other's network namespace at all. The first step of every shard
  # prints the server's `system_identifier`, which is generated at initdb
  # time: two different values in one run is the proof, in the log, that these
  # are two different Postgres instances and not one shared one.
  #
  # Inside a shard nothing changed: `--workspace-concurrency=1` keeps the
  # packages serial with each other, and `fileParallelism: false` keeps each
  # package's files serial with themselves. Both are still required — the
  # packages in a shard share that shard's one database and truncate it.
  # -----------------------------------------------------------------------
  db-shard:
    name: db-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A red shard must not cancel its sibling: two failures found in one run
      # is one round trip, and the aggregator needs every shard's report to say
      # anything about test counts.
      fail-fast: false
      matrix:
        include:
          # dashboard 67.4s + db 4.9s + seed 1.7s = 74.0s (measured, run 33105968752)
          - shard: hub
            packages: '@shikoo/dashboard @shikoo/db @shikoo/seed'
            covered: ''
          # bot 42.8s + ingest 17.2s + domain 12.7s = 72.7s
          - shard: services
            packages: '@shikoo/bot @shikoo/ingest'
            covered: '@shikoo/domain'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shikoo_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/shikoo_test
      # Test the failure modes ENV_NAME is supposed to refuse.
      ENV_NAME: test
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: This shard has its own Postgres, and it starts empty
        # `system_identifier` is written once, by initdb, into pg_control. It
        # cannot be shared by two servers, so printing it here is the isolation
        # proof: compare the two shards' values in one run.
        #
        # The emptiness check is the other half. A populated database at this
        # point would mean the service container was reused or the URL points
        # at something real, and a suite that truncates must never be aimed at
        # either.
        run: |
          set -Eeuo pipefail
          case "$DATABASE_URL" in
            *@localhost:5432/shikoo_test|*@127.0.0.1:5432/shikoo_test) ;;
            *) echo "::error::refusing to run against ${DATABASE_URL}"; exit 1 ;;
          esac
          id=$(psql "$DATABASE_URL" -tAc 'SELECT system_identifier FROM pg_control_system()')
          started=$(psql "$DATABASE_URL" -tAc 'SELECT pg_postmaster_start_time()')
          echo "shard=${SHARD} runner=${RUNNER_NAME} pg_system_identifier=${id} started=${started}"
          echo "| db-shard \`${SHARD}\` | Postgres \`${id}\` |" >> "$GITHUB_STEP_SUMMARY"
          tables=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          [ "$tables" = '0' ] || { echo "::error::shard database is not empty (${tables} tables)"; exit 1; }

      - name: Apply migrations
        # @shikoo/db runs against a real database, including a check that every
        # hub SQL statement parses against this schema. It needs the schema to
        # exist. Through the ledger, not a shell loop over the files: production
        # runs `schema up`, and a runner CI never exercises is one CI cannot
        # vouch for.
        run: pnpm --filter @shikoo/db schema up
      - name: The schema matches this checkout
        run: pnpm --filter @shikoo/db schema status

      - name: Run the shard
        env:
          PACKAGES: ${{ matrix.packages }}
          COVERED: ${{ matrix.covered }}
        run: bash tools/ci-run-tests.sh "$PACKAGES" "$COVERED"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: reports-db-${{ matrix.shard }}
          path: |
            packages/*/vitest-report.json
            apps/*/vitest-report.json
            packages/*/coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # The clean-database gate: every migration in order, from nothing.
  #
  # This job never reuses another job's database. It starts with an empty
  # Postgres, applies all of them through the ledger, asserts the schema is
  # current, proves the money invariants and COUNTS them, then runs the
  # migration suite against the synthetic legacy source.
  #
  # The image checks live here rather than in a job of their own because they
  # need a Postgres and nothing else, and this job already has one that has
  # finished being interesting by the time they run. A separate job would be a
  # second container pull and a second billed minute for 40 seconds of work.
  # -----------------------------------------------------------------------
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shikoo_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      # The legacy source, for the migration gate. Empty at start; the
      # synthetic fixture is loaded into it below. NOT the production dump —
      # that is git-ignored and stays on one machine.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: mirzabot
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pci"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports: ['3307:3306']
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/shikoo_test
      ENV_NAME: test
      # `MIGRATE_FIXTURE_MYSQL=1` is what turns `synthetic-migration.test.ts`
      # on; without it that file skips, and `ci-verify-gate.ts` fails the run
      # because the skip count went up.
      MIGRATE_FIXTURE_MYSQL: '1'
      MYSQL_HOST: 127.0.0.1
      # 3307, the same host port `sim/docker-compose.yml` uses and the default
      # `loadConfig()` returns — so `config.test.ts`, which asserts that
      # default, is not fighting an override the gate set.
      MYSQL_PORT: '3307'
      MYSQL_USER: root
      MYSQL_PASSWORD: ci
      MYSQL_DATABASE: mirzabot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The migration gate starts from an empty database
        run: |
          set -Eeuo pipefail
          id=$(psql "$DATABASE_URL" -tAc 'SELECT system_identifier FROM pg_control_system()')
          echo "runner=${RUNNER_NAME} pg_system_identifier=${id}"
          echo "| migrations | Postgres \`${id}\` |" >> "$GITHUB_STEP_SUMMARY"
          tables=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          [ "$tables" = '0' ] || { echo "::error::database is not empty (${tables} tables)"; exit 1; }

      # The legacy source the migration gate reads. Synthetic, in the repo, and
      # nothing in it came from the production dump — see the header of
      # `synthetic-mirzabot.sql` for what it can and cannot prove.
      - name: Load the synthetic legacy database
        run: |
          set -Eeuo pipefail
          mysql --protocol=TCP -h127.0.0.1 -P3307 -uroot -pci mirzabot \
            < packages/migrate/test/fixtures/synthetic-mirzabot.sql
          echo "D1_EXPORT_DIR=${GITHUB_WORKSPACE}/packages/migrate/test/fixtures/d1-export" \
            >> "$GITHUB_ENV"
          # shellcheck disable=SC2016
          # `user` is a reserved word in MySQL and must stay backticked; the
          # single quotes keep the shell out of it entirely. Nothing here is
          # meant to expand.
          rows=$(mysql --protocol=TCP -h127.0.0.1 -P3307 -uroot -pci mirzabot -sN \
            -e 'SELECT COUNT(*) FROM `user`')
          echo "synthetic users loaded: ${rows}"
          [ "$rows" -gt 0 ] || { echo '::error::the fixture loaded no rows'; exit 1; }

      - name: Apply every migration, in order, and count them
        run: |
          set -Eeuo pipefail
          pnpm --filter @shikoo/db schema up
          pnpm --filter @shikoo/db schema status | tee /tmp/schema-status.txt
          grep -q 'schema is current' /tmp/schema-status.txt
          applied=$(awk '/^applied/ { print $2 }' /tmp/schema-status.txt)
          pending=$(awk '/^pending/ { print $2 }' /tmp/schema-status.txt)
          echo "migrations applied: ${applied}, pending: ${pending}"
          [ "$pending" = '0' ] || { echo "::error::${pending} migration(s) pending"; exit 1; }
          echo "MIGRATIONS_APPLIED=${applied}" >> "$GITHUB_ENV"

      - name: Prove the money invariants, and count them
        # Each assertion in the file emits one `PASS` notice. Counting them is
        # what turns "the script exited 0" into "the script actually asserted
        # thirty-two things" — a file whose assertions were commented out also
        # exits 0.
        run: |
          set -Eeuo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q \
            -f migrations/verify_invariants.sql > /tmp/invariants.log 2>&1
          cat /tmp/invariants.log
          # `grep -c` exits 1 on zero matches, which under `set -e` would abort
          # before the assertion below could report the real problem. Zero is
          # substituted so the assertion is what fails, with the count in it.
          invariants=$(grep -c 'PASS ' /tmp/invariants.log || printf '0')
          echo "invariants proved: ${invariants}"
          [ "$invariants" -gt 0 ] || { echo '::error::the invariant script asserted nothing'; exit 1; }
          echo "INVARIANTS_PROVED=${invariants}" >> "$GITHUB_ENV"

      - name: The migration suite
        run: bash tools/ci-run-tests.sh '@shikoo/migrate' ''

      - name: Publish the migration and invariant counts
        run: |
          set -Eeuo pipefail
          mkdir -p out
          printf '{"migrations":%s,"invariants":%s}\n' \
            "$MIGRATIONS_APPLIED" "$INVARIANTS_PROVED" > out/schema-counts.json
          cat out/schema-counts.json
          {
            echo "| migrations applied | ${MIGRATIONS_APPLIED} |"
            echo "| invariants proved  | ${INVARIANTS_PROVED} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The only gate that measures the artifact rather than the source.
      #
      # On 2026-08-16 every check above was green, the image built and pushed,
      # and not one container could start: `deploy/entrypoint.sh` was committed
      # 100644 and `COPY` carries the source mode, so `runc` refused the
      # entrypoint with «permission denied». Nothing that reads TypeScript can
      # see that, and the first thing that did was a production deploy.
      - name: The image reaches its entrypoint
        run: |
          docker build -t shikoo-ci .
          out=$(docker run --rm shikoo-ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'SERVICE is required'

      # What is in the artifact, not what the manifests say is in it.
      #
      # `runtime` was `FROM build` until 2026-08-22, so the image three
      # public-facing services run from carried vitest, playwright, eslint and
      # typescript — 29 of its 290 packages — along with every test file in the
      # repository. Nothing ran them, which is why it went unnoticed for months:
      # `pnpm audit --prod` reads manifests and reported zero the whole time,
      # while a scanner reads layers.
      - name: The production image carries no test runner and no tests
        run: |
          dev=$(docker run --rm --entrypoint sh shikoo-ci -c 'ls node_modules/.pnpm | grep -ciE "^(vitest|@vitest|playwright|@playwright|eslint|typescript|@typescript-eslint)@" || true')
          ours=$(docker run --rm --entrypoint sh shikoo-ci -c 'find /app/apps /app/packages \( -name "*.test.ts" -o -name "*.spec.ts" \) | wc -l')
          echo "dev-tooling packages: $dev   our test files: $ours"
          [ "$dev" = "0" ] && [ "$ours" = "0" ]

      # The gate, measured on the artifact rather than on the source.
      - name: A container refuses to start on a schema it does not match
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c 'CREATE DATABASE behind_by_everything'
          behind="${DATABASE_URL%/*}/behind_by_everything"
          out=$(docker run --rm --network host -e SERVICE=bot -e DATABASE_URL="$behind" shikoo-ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'refusing to start'

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: reports-migrations
          path: |
            packages/*/vitest-report.json
            out/schema-counts.json
          retention-days: 7
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # The browser walk against a real server and a real SPA. The unit suite has
  # covered the dashboard-worker routes for months; this one proves the SPA
  # itself wires to them, with the cookies, the redirects and the keyboard the
  # suite cannot fake.
  #
  # Needs the schema applied and the simulation seeded (`seed:sim`), because
  # global-setup.ts grants a role to the operator the browser signs in as — the
  # failure on an empty database is a flat 403 on every page, which reads as a
  # broken panel rather than as a missing fixture. See `memory/e2e-needs-sim-seed`.
  #
  # Still ONE job, and still `workers: 1`. Splitting it into two isolated shards
  # was not estimated, it was RUN — `playwright --shard=i/2`, each shard with its
  # own Postgres, its own seed and its own pair of servers, on run 33116322185:
  #
  #                     wall     billed      compute
  #   one shard         198s     19 min      844s
  #   two shards        166s     20 min      911s
  #
  # It works, and the aggregator merged both reports and counted the full 104
  # scenarios. It is simply the wrong side of the runner-minute budget: 32s of
  # wall time for a billed minute, because 77s of the job's 176s is fixed setup
  # that sharding duplicates rather than divides, and +17.6% over the old
  # workflow breaches the 15% ceiling this change was held to.
  #
  # If that ceiling is ever raised, this is the first thing to spend it on and
  # it is one `strategy.matrix` away.
  # -----------------------------------------------------------------------
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shikoo_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/shikoo_test
      # `seed:sim` refuses anything that is not `local` or `test`; the panel
      # server refuses to start without it. Named once here so both agree.
      ENV_NAME: test
      # `playwright.config.ts` reads sim/.env.local; the global setup and the
      # panel server both consult it for TEST_ACCESS_USER. The file is created
      # below, on this runner, with the same DATABASE_URL the service carries.
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Before any destructive command. `seed:sim` truncates every table it is
      # pointed at, and the one thing standing between it and a real database
      # is this connection string. `assertLocal` inside the seed runner checks
      # the same thing; this is the outer half of that pair, and it is here so
      # the job fails at the step that named the database rather than four
      # steps later inside a package.
      - name: Prove the target is a disposable CI database
        run: |
          set -Eeuo pipefail
          echo "target: ${DATABASE_URL%%\?*}"
          case "$DATABASE_URL" in
            *@localhost:5432/shikoo_test|*@127.0.0.1:5432/shikoo_test) ;;
            *)
              echo "::error::refusing to seed ${DATABASE_URL} — not the CI database"
              exit 1
              ;;
          esac
          [ "$ENV_NAME" = 'test' ] || { echo "::error::ENV_NAME=${ENV_NAME}"; exit 1; }
          id=$(psql "$DATABASE_URL" -tAc 'SELECT system_identifier FROM pg_control_system()')
          echo "runner=${RUNNER_NAME} pg_system_identifier=${id}"
          echo "| e2e | Postgres \`${id}\` |" >> "$GITHUB_STEP_SUMMARY"
          # A CI database is empty before this job touches it. A populated one
          # means the service container was reused or the URL points somewhere
          # real, and either way seeding it is not safe.
          existing=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "public tables before schema up: ${existing}"
          [ "$existing" = '0' ] || { echo "::error::database is not empty"; exit 1; }

      - name: Write sim/.env.local
        # BEFORE the schema and seed steps. `seed:sim` itself reads
        # `sim/.env.local` through `--env-file`, so the file must exist first,
        # or the seed step fails with «sim/.env.local: not found» — the error
        # reads as a broken package rather than a step that ran two lines too
        # early.
        #
        # Written with 0600 and removed in the always() cleanup below. It holds
        # no real credential on a runner — the DATABASE_URL is the throwaway
        # service container and TEST_ACCESS_USER is a fixture address — but the
        # file is git-ignored precisely because on a developer machine it holds
        # a Telegram token, and the CI copy should not be the exception that
        # teaches everyone it is safe to leave lying around.
        run: |
          set -Eeuo pipefail
          umask 077
          # NOT an `@shikoo.local` address. `config.spec.ts:303` finds
          # «somebody other than me» with `tr:has-text("@shikoo.local")`, and
          # the seeded operators live on that domain — so signing in AS one
          # made the signed-in row (which correctly has no delete button) the
          # first match, and the spec failed on a fixture collision that reads
          # exactly like a broken permission check.
          printf 'DATABASE_URL=%s\nTEST_ACCESS_USER=ci-operator@example.test\nENV_NAME=test\n' \
            "$DATABASE_URL" > sim/.env.local
      - name: Apply schema
        run: pnpm --filter @shikoo/db schema up
      - name: Seed the simulation database
        run: pnpm --filter @shikoo/seed seed:sim

      # The Playwright browser — the suite asserts on real renders, not a
      # headless double. Cached on the resolved playwright version, so the
      # ~130MB chromium download happens once per version bump rather than once
      # per run. `install --with-deps` still runs either way: it is idempotent,
      # and the apt packages it installs are not part of the cached directory.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          set -Eeuo pipefail
          version=$(pnpm --filter @shikoo/dashboard exec playwright --version | awk '{ print $2 }')
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::could not resolve the playwright version (got '${version}')"; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          # Scoped to this workflow's own runs and invalidated by the version
          # alone: the directory holds vendor browser binaries keyed by that
          # version and nothing this repository produces, so no branch can put
          # anything of its own into it.
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        run: pnpm --filter @shikoo/dashboard exec playwright install --with-deps chromium

      # Build the SPA the dashboard-worker serves at `/admin`, once. The
      # package's `e2e` script builds it too, which is why the run below calls
      # `playwright test` directly instead — the job was paying for that build
      # twice.
      - name: Build the admin SPA
        run: pnpm --filter @shikoo/admin-web build

      - name: Run the e2e suite
        run: pnpm --filter @shikoo/dashboard exec playwright test

      # Diagnostics, and only on failure. A trace carries request bodies and
      # rendered pages, so it is scrubbed before it leaves the runner: the env
      # file goes first, and the report is checked for the two values that
      # could plausibly be in it.
      - name: Scrub before uploading anything
        if: failure()
        run: |
          set -Eeuo pipefail
          rm -f sim/.env.local
          # A belt-and-braces grep. The DATABASE_URL password is the literal
          # `ci`, which is too short to grep for usefully; the address is not.
          if [ -d apps/dashboard-worker/test-results ]; then
            grep -rl 'ci-operator@example.test' apps/dashboard-worker/test-results 2>/dev/null \
              | head -20 || true
          fi

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-${{ github.run_id }}
          path: |
            apps/dashboard-worker/test-results
            apps/dashboard-worker/playwright-report
          # Short, because these carry rendered pages of a seeded shop.
          retention-days: 3
          if-no-files-found: ignore

      # The scenario count, for the aggregator. Titles and outcomes only — the
      # json reporter carries no page content, unlike the trace above.
      - name: Upload the Playwright result count
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: reports-e2e
          path: apps/dashboard-worker/playwright-report.json
          retention-days: 7
          if-no-files-found: error

      # Always, including on cancellation. The file is git-ignored, so it can
      # never be committed — but a runner is reused within a job, and leaving
      # it means a later step in the same job could read it by accident.
      - name: Remove sim/.env.local
        if: always()
        run: rm -f sim/.env.local

  # -----------------------------------------------------------------------
  # The CI files themselves, and every shell script this repo ships.
  #
  # `actionlint` reads workflow YAML with the semantics GitHub itself applies
  # at run time, and — with shellcheck on PATH, which `ubuntu-latest` has —
  # ALSO runs shellcheck over every `run:` block. The previous version passed
  # `ignore: SC`, which switched all of that off. Every shellcheck finding is
  # now either fixed or carries a `# shellcheck disable=SCxxxx` at the exact
  # line, with the reason beside it.
  #
  # `deploy/*.sh` and `tools/*.sh` are linted separately: those run as root on
  # a box holding customer money, and they are the scripts most worth a linter.
  # -----------------------------------------------------------------------
  workflows-lint:
    name: workflows-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: shellcheck is present (actionlint uses it for `run:` blocks)
        run: shellcheck --version

      - name: actionlint (pinned commit SHA, with the human-readable version)
        # The SHA pins the exact code shipped; the comment tells a human which
        # release that SHA corresponds to without re-deriving it.
        #
        # No `ignore:` — see the block comment above.
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106  # v1.7.7

      - name: shellcheck every shipped script
        run: |
          set -Eeuo pipefail
          # -x follows `source`d files; -S style is the strictest level that
          # still only reports things worth changing.
          find deploy tools -name '*.sh' -type f -print0 2>/dev/null \
            | xargs -0 --no-run-if-empty shellcheck --external-sources --severity=style

      # The deploy trigger, against a fake GitHub and a fake Coolify.
      #
      # It lives here rather than in a test job because it needs no database and
      # no node_modules — it is bash, `jq` and `curl`, all three on the runner
      # already. Thirteen cases; each one fails if the guard it names is
      # removed, which was verified by removing each of them in turn.
      - name: autodeploy — exact-SHA behaviour
        run: bash deploy/test/autodeploy.test.sh

      # The live deploy path: the approval gate, the bot switch, the deploy
      # lock, and the assertions about `deploy.yml` that actionlint cannot
      # make — «a CI run from a pull request cannot deploy» is a property of
      # the file's meaning, not of its syntax.
      - name: deploy pipeline — gate, bot switch, digest promotion
        run: bash deploy/test/deploy-pipeline.test.sh

      # The duplicate-variable classifier decrypts a DATABASE_URL and a bot
      # token in order to say which row is which. Most of this suite is the
      # negative half — the sentinel secrets must appear nowhere in its output
      # — because a tool that reads secrets to describe them is one careless
      # printf away from putting a production URL in a CI log.
      - name: coolify duplicate classifier — it reads secrets and prints none
        run: bash deploy/test/classify-envs.test.sh

      # The production-dump attestation, as a control rather than a document.
      # The question this suite asks is not «can one be written» but «can a
      # promotion proceed without one that verifies», so most of it is
      # refusals: missing, malformed, mismatched and stale, each by its own
      # message.
      - name: production-dump attestation — missing, stale and mismatched all block
        run: bash deploy/test/attestation.test.sh

      # The two-dispatch production release leaves a deliberate gap so a person
      # can read the evidence. This suite is about what happens in that gap:
      # every fact preparation recorded is re-observed at cutover, and an
      # observation that was never gathered is refused rather than assumed.
      - name: production preparation — drift between prepare and cutover blocks
        run: bash deploy/test/preparation.test.sh

  # -----------------------------------------------------------------------
  # Secret detection.
  #
  # ## Why the CLI and not `gitleaks/gitleaks-action`
  #
  # gitleaks-action v2 requires `GITLEAKS_LICENSE` for any repository owned by
  # an ORGANISATION. This repository is `Shikoonet/Shikoonet-Platform`, so the
  # action exits with «missing GITLEAKS_LICENSE» on every run — a required
  # check that can never pass, which is worse than no check at all. The CLI is
  # MIT-licensed with no such gate.
  #
  # The release archive is pinned by version AND verified by sha256 before it
  # is unpacked. A pinned version alone trusts that the tag was not re-cut;
  # the checksum is what makes the download immutable.
  #
  # ## Two scans, because they answer different questions
  #
  #   `gitleaks dir`   — every tracked file as it stands. Catches a secret that
  #                      an earlier commit introduced and this PR merely moves.
  #   `gitleaks git`   — the commit range this PR adds. Catches a secret that
  #                      was added and then deleted within the PR, which the
  #                      working-tree scan cannot see.
  #
  # Both use `.github/gitleaks.toml`, whose allow-list names exact synthetic
  # values and excludes no directory at all.
  # -----------------------------------------------------------------------
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The commit-range scan needs both sides of the range.
          fetch-depth: 0

      - name: Install gitleaks (pinned release, sha256-verified)
        run: |
          set -Eeuo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "$url"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the working tree
        run: |
          set -Eeuo pipefail
          ./gitleaks dir . \
            --config .github/gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1

      - name: Scan the commits this pull request adds
        # Only meaningful on a pull_request; a push to main has no range to
        # compare against and the working-tree scan above already covers it.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          ./gitleaks git . \
            --config .github/gitleaks.toml \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --no-banner \
            --exit-code 1

      - name: Project-specific deny-list
        # Paths and substrings gitleaks has no rule for, but which this project
        # knows are wrong. Not secrets in themselves — a file NAME that should
        # never be committed, and a host address that should never be pasted.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail

          if [ -n "${BASE_REF}" ]; then
            range="origin/${BASE_REF}...HEAD"
          else
            # push / merge_group / workflow_dispatch: compare against the
            # parent commit, so the check still says something on a direct
            # push instead of silently passing.
            range="HEAD~1...HEAD"
          fi
          echo "range: ${range}"

          denied=0

          # Paths that must never appear in a commit.
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              .notes|.notes/*)
                echo "DENY: ${path} — .notes/ holds the work machine's tokens"
                denied=$((denied + 1))
                ;;
              legacy/mirzabot-php/db|legacy/mirzabot-php/db/*)
                echo "DENY: ${path} — the production dump is git-ignored on purpose"
                denied=$((denied + 1))
                ;;
              sim/.env.local)
                echo "DENY: ${path} — holds the test bot token; git-ignored on purpose"
                denied=$((denied + 1))
                ;;
            esac
          done <<< "$(git diff --name-only "$range" || true)"

          # Substrings that must never appear in ADDED lines. Restricted to
          # additions (`^+`) so that a commit which REMOVES one of these is
          # not punished for the removal.
          if git diff "$range" | grep -E '^\+' | grep -qE '164\.132\.198\.184'; then
            echo 'DENY: an added line names the practice server by address'
            denied=$((denied + 1))
          fi

          if [ "$denied" -gt 0 ]; then
            echo "::error::${denied} deny-list violation(s)"
            exit 1
          fi
          echo 'deny-list: clean'

  # -----------------------------------------------------------------------
  # Stable final aggregator.
  #
  # Reports PASS only when every required job passed AND every required job
  # left behind the evidence that it ran what it claims. Runs `if: always()`
  # so a cancelled earlier job still produces an explicit verdict — the
  # ruleset, when it exists, sees one check, not a forest of pending ones.
  #
  # Two halves, and the second is why this job grew:
  #
  #   1. Job results. `success` is the only acceptable value. `skipped` is
  #      treated as failure on purpose: a skipped required check is what
  #      `pull_request_target`-style attacks and missing-path-filter bugs look
  #      like. For the `db-shard` matrix, `needs.db-shard.result` is already
  #      the aggregate — one red shard makes it `failure`.
  #
  #   2. Evidence. A green matrix proves nothing about a shard that never ran:
  #      a filter matching no package exits 0, and a matrix trimmed to one
  #      entry leaves nothing to notice. `tools/ci-verify-gate.ts` reads what
  #      every shard uploaded and checks it against `.github/ci-baseline.json`.
  #      A missing report is a failure, not a warning.
  # -----------------------------------------------------------------------
  Required-Quality-Gate:
    name: Required Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, arch, unit, db-shard, migrations, e2e, workflows-lint, secrets]
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Collect every shard's report
        # `reports-*` only. The Playwright failure artifact carries traces of
        # rendered pages and is megabytes; nothing here reads it.
        #
        # No `continue-on-error`: if not one shard uploaded a report, this step
        # fails and the gate is red, which is the correct verdict. When SOME
        # shards uploaded, the download succeeds and the verify step below is
        # what names the missing ones.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: ci-reports
          pattern: 'reports-*'

      - name: Every required job succeeded
        id: results
        env:
          LINT: ${{ needs.lint.result }}
          ARCH: ${{ needs.arch.result }}
          UNIT: ${{ needs.unit.result }}
          DB: ${{ needs.db-shard.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          E2E: ${{ needs.e2e.result }}
          WF: ${{ needs.workflows-lint.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          set -Eeuo pipefail
          {
            echo "## Required Quality Gate"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| lint            | ${LINT} |"
            echo "| arch            | ${ARCH} |"
            echo "| unit            | ${UNIT} |"
            echo "| db-shard (all)  | ${DB} |"
            echo "| migrations      | ${MIGRATIONS} |"
            echo "| e2e             | ${E2E} |"
            echo "| workflows-lint  | ${WF} |"
            echo "| secrets         | ${SECRETS} |"
            echo
            echo "Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          bad=0
          for r in "${LINT}" "${ARCH}" "${UNIT}" "${DB}" "${MIGRATIONS}" "${E2E}" "${WF}" "${SECRETS}"; do
            if [ "$r" != "success" ]; then
              echo "::error::Required Quality Gate: a required job reported '${r}'"
              bad=$((bad + 1))
            fi
          done
          echo "bad=${bad}" >> "$GITHUB_OUTPUT"
          [ "$bad" -eq 0 ]

      - name: Every required job left the evidence that it ran
        # `always()` and NOT conditional on the step above: when a shard fails,
        # its report still names which tests failed, and printing that beside
        # the red job result is worth more than a second «a job failed».
        if: always()
        run: pnpm exec tsx tools/ci-verify-gate.ts ci-reports

      - name: Verdict
        run: |
          echo "Required Quality Gate: success" >> "$GITHUB_STEP_SUMMARY"
