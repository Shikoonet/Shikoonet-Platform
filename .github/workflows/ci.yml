name: CI

# Every branch, and `push` rather than `pull_request`, deliberately.
#
# A branch is deployed to development before it is merged, which means the
# workflow that deploys it holds the server's SSH key. `pull_request` fires for
# code from anywhere, including a fork nobody has read; `push` fires only for a
# branch that already exists in this repository, which means somebody with
# write access put it there. That distinction is the whole reason this is safe
# to do at all, and it is why there is no `pull_request` trigger here: a run
# from a push already appears on the pull request as its checks.
#
# The cost, stated: a fork's pull request gets no CI. On a private repository
# with two people that trade is worth making; on a public one it would not be.
on:
  push:
    branches: ['**']

# Read-only by default. Exactly one job below widens this — `publish`, which
# needs `packages: write` to push the image. Every run here comes from a push
# by someone with write access; nothing else can trigger this workflow.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # A wedged container or a hung test must not hold a runner all day.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shikoo_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/shikoo_test
    steps:
      # Actions are pinned to commit shas, not tags: a tag is mutable and these
      # run with a token. The trailing comment is the release each sha is.
      #
      # `persist-credentials: false` because nothing here pushes. The default
      # leaves a working git credential in the runner for every later step.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # No `version:` here — action-setup v4 errors out if it is given one *and*
      # package.json has `packageManager`. That field is the single source.
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

      # Before the tests, not after: @shikoo/db runs against a real database,
      # including a check that every hub SQL statement parses against this
      # schema. It needs the schema to exist.
      #
      # Gating the migrations themselves also matters on its own — without it a
      # migration that fails to apply, or one that quietly drops a partial
      # unique index, reaches main with every other check green.
      #
      # Through the ledger, not a shell loop over the files. The loop applied
      # the same SQL and proved a different thing: production runs `schema up`,
      # and a runner CI never exercises is a runner CI cannot vouch for. It also
      # left the ledger empty, so `schema status` here disagreed with a
      # correctly migrated database — which is how the simulation was found on
      # 2026-08-18 reporting a migration pending that had in fact been applied.
      - name: Apply migrations
        run: pnpm --filter @shikoo/db schema up

      # The gate a container will run at boot, run here where it is cheap to
      # fix. Green means the ledger, the files and the database agree.
      - name: The schema matches this checkout
        run: pnpm --filter @shikoo/db schema status
      - name: Prove the money invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f migrations/verify_invariants.sql

      - run: pnpm test

      # The only gate that measures the artifact rather than the source.
      #
      # On 2026-08-16 every check above was green, the image built and pushed,
      # and not one container could start: `deploy/entrypoint.sh` was committed
      # 100644 and `COPY` carries the source mode, so `runc` refused the
      # entrypoint with «permission denied». Nothing that reads TypeScript can
      # see that, and the first thing that did was a production deploy.
      #
      # The run is deliberately the cheapest possible: no database, no token, no
      # network. What is asserted is only that the container reaches its
      # entrypoint — and the proof is the entrypoint's own refusal to guess which
      # of the three services it is, which is a message it can only print if it
      # ran. A `Cannot find module` or a `permission denied` fails this.
      #
      # ponytail: this used to say «builds the image on every run … cache it with
      # buildx if the wait ever matters more than the certainty». It does now:
      # the same image is built a second time in `publish` to be pushed, so the
      # build happens twice per merge. The cache is layer-level and shared
      # through the Actions cache, so the second build is a few seconds and the
      # certainty is unchanged — what is gated is still a real build of this
      # commit, not a downloaded artifact.
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: The image reaches its entrypoint
        run: |
          docker buildx build --load --cache-from type=gha --cache-to type=gha,mode=max -t shikoo-ci .
          out=$(docker run --rm shikoo-ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'SERVICE is required'

      # What is in the artifact, not what the manifests say is in it.
      #
      # `runtime` was `FROM build` until 2026-08-22, so the image three
      # public-facing services run from carried vitest, playwright, eslint and
      # typescript — 29 of its 290 packages — along with every test file in the
      # repository. Nothing ran them, which is why it went unnoticed for months:
      # `pnpm audit --prod` reads manifests and reported zero the whole time,
      # while a scanner reads layers.
      #
      # Asserted here rather than by reading the Dockerfile, because the failure
      # is one word — a base stage changed back — and the Dockerfile would still
      # look deliberate.
      - name: The production image carries no test runner and no tests
        run: |
          dev=$(docker run --rm --entrypoint sh shikoo-ci -c 'ls node_modules/.pnpm | grep -ciE "^(vitest|@vitest|playwright|@playwright|eslint|typescript|@typescript-eslint)@" || true')
          ours=$(docker run --rm --entrypoint sh shikoo-ci -c 'find /app/apps /app/packages \( -name "*.test.ts" -o -name "*.spec.ts" \) | wc -l')
          echo "dev-tooling packages: $dev   our test files: $ours"
          [ "$dev" = "0" ] && [ "$ours" = "0" ]

      # The gate, measured on the artifact rather than on the source.
      #
      # A database with nothing in it is every migration pending, which is the
      # 2026-08-17 failure in its purest form. The container must refuse to
      # start on it — and it must be the SCHEMA that stops it, not a missing
      # token or an unreachable host, so the refusal is matched by its own
      # words rather than by a non-zero exit.
      - name: A container refuses to start on a schema it does not match
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c 'CREATE DATABASE behind_by_everything'
          behind="${DATABASE_URL%/*}/behind_by_everything"
          out=$(docker run --rm --network host -e SERVICE=bot -e DATABASE_URL="$behind" shikoo-ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'refusing to start'

      # Every SERVICE the entrypoint accepts, and one it does not.
      #
      # The gate above proves the entrypoint runs and refuses an unset SERVICE.
      # It says nothing about the four values that are supposed to work, and
      # `SERVICE` is the whole switch: a typo in one branch of that `case`
      # starts the wrong process, or nothing, and the image still passes every
      # check written before this one.
      #
      # The bot is deliberately absent from the started services. Starting it
      # needs a real Telegram token, and this workflow is never getting one —
      # its entrypoint branch is already exercised by the schema-refusal gate
      # above, which runs `SERVICE=bot` and proves the branch is reached.
      - name: All four SERVICE values behave
        run: |
          set -euo pipefail

          # migrate, against the database this job already migrated: it must
          # find nothing to do and exit 0. A migrate that re-applies is a
          # migrate that would fail on the second deploy of any release.
          out=$(docker run --rm --network host -e SERVICE=migrate -e DATABASE_URL="$DATABASE_URL" shikoo-ci 2>&1)
          echo "$out"
          echo "$out" | grep -q 'nothing to apply'

          # ingest and dashboard, started for real and asked the question their
          # own HEALTHCHECK asks. ENV_NAME is `test`, not production: the point
          # is the process boots and answers, not that it is configured for
          # customers.
          for svc in ingest:8787:/health dashboard:8788:/api/v1/health; do
            name=${svc%%:*}; rest=${svc#*:}; port=${rest%%:*}; path=${rest#*:}
            docker run -d --rm --name "ci-$name" --network host \
              -e SERVICE="$name" -e ENV_NAME=test -e DATABASE_URL="$DATABASE_URL" shikoo-ci
            ok=0
            for _ in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port$path" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 2
            done
            docker logs "ci-$name" 2>&1 | tail -20
            docker stop "ci-$name" >/dev/null
            [ "$ok" = "1" ] || { echo "$name never answered 200 on $path"; exit 1; }
            echo "$name: 200 on $path"
          done

          # And a value that is not one of the four.
          out=$(docker run --rm -e SERVICE=nonsense shikoo-ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'is not one of'

      # The deploy script, against real containers.
      #
      # Everything that script is for is a refusal or a recovery — a failed
      # migration touching nothing, a broken image being rolled back, two
      # deploys not interleaving — and none of it happens on a good day. Left
      # unexercised it would be verified exactly once, by hand, and then only
      # ever run again during an outage.
      #
      # It builds its own database, registry and network, prefixed
      # `deploytest`, and removes them on exit. It cannot reach a real
      # environment: every path it hands the deploy script is a temporary
      # directory, which is why those are environment variables in the first
      # place.
      #
      # Here rather than in a job of its own so it reuses the image built
      # above; it adds roughly three minutes, most of it waiting for health
      # checks to settle.
      - name: The deploy script's refusals and its rollback
        run: deploy/host/deploy-test.sh shikoo-ci

  # The browser half. It is a separate job rather than more steps in `gate`
  # because it needs a browser, a built SPA and two servers of its own, and
  # because a red e2e and a red unit suite are different questions — running
  # them in parallel means both answers arrive, not just the first one.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shikoo_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/shikoo_test
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # playwright.config.ts throws if this file is absent — it is how the
      # simulation environment is declared, and a config that silently invented
      # a database would be worse. The values here are a throwaway database and
      # an address nobody can receive mail at: `.invalid` is reserved by RFC
      # 2606 precisely so it can never be a real recipient.
      #
      # Written, not committed: `sim/.env.local` is gitignored because on a
      # developer's machine it holds a bot token.
      - name: Declare the simulation environment
        run: |
          cat > sim/.env.local <<'ENV'
          DATABASE_URL=postgres://postgres:ci@localhost:5432/shikoo_test
          TEST_ACCESS_USER=ci@example.invalid
          ENV

      # global-setup seeds operators and the shop; it does not create the
      # schema, and says so. Same runner as production, same ledger.
      - name: Apply migrations
        run: pnpm --filter @shikoo/db schema up

      # And the rest of the data the specs are written against.
      #
      # `global-setup` runs `seedShop`, which is the catalog and the operators.
      # It is NOT the whole simulation: the devices with credentials, the bank
      # transactions, the payment claims and the stock rows come from
      # `seed:sim`, which wipes and rebuilds deterministically. Without it 13
      # specs fail on their own premise — «the seed should give at least one
      # device a credential» — which reads like a broken feature and is a
      # missing fixture. Measured 2026-08-26: 87 passing without this step, 100
      # with it.
      #
      # Safe here by its own three guards, all of which this job satisfies: the
      # host is local, ENV_NAME is unset or relaxed, and the database holds
      # nothing. It refuses to run against anything else.
      - name: Seed the simulation
        run: pnpm --filter @shikoo/seed seed:sim

      # Chromium only — the suite declares no projects, so this is the whole
      # matrix. `--with-deps` because the runner has none of the shared
      # libraries a headless browser needs.
      - name: Install the browser
        run: pnpm --filter @shikoo/dashboard exec playwright install --with-deps chromium

      # Builds the SPA, then runs the specs. Playwright starts both servers
      # itself — the bypass one it points baseURL at, and a second with no
      # TEST_ACCESS_USER so the real login can be tested through the front door.
      - name: Browser tests
        run: pnpm --filter @shikoo/dashboard e2e

      # Traces are `retain-on-failure`, so this directory is empty on green and
      # holds a replayable trace of every failed spec on red. No secrets reach
      # it: the only credentials in play are the throwaway ones above.
      - name: Keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-traces
          path: apps/dashboard-worker/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The pipeline's own code, checked by the same kind of tool it checks
  # everything else with. A workflow typo is not a compile error anywhere: it
  # is a job that silently never runs, or a deploy step that expands to
  # nothing. Both are cheaper to find here.
  workflows-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # Pinned by digest for the same reason the actions are pinned by sha.
      - name: Lint the workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color  # 1.7.7
      # shellcheck is preinstalled on the runner. These four scripts run as root
      # or as the deploy user on a server that has customer money in its
      # database; an unquoted variable there is not a style question.
      - name: Lint the shell scripts
        run: shellcheck deploy/*.sh deploy/host/*.sh

  # ---------------------------------------------------------------- publish
  # Everything above runs on pull requests too. Nothing from here down does:
  # `github.event_name == 'push'` and the branch filter at the top of this file
  # mean these two jobs exist only for a commit that is already on main.
  #
  # This is the job that turns a green commit into a deployable identity. It
  # builds the image AGAIN — from the layer cache `gate` filled, so it is
  # seconds — runs the same three artifact gates against THAT image, and only
  # then pushes it. Gating a local image and pushing the same local image is
  # what makes «the deployed artifact is the tested artifact» a fact rather
  # than an assumption; a rebuild after the gates would be a different image
  # with the same source.
  #
  # The commit goes into the image as an OCI label, which is what the server
  # checks after pulling. It is a label rather than a build arg on purpose:
  # a build arg would be a layer, and a new layer per commit is a cache miss
  # per commit.
  publish:
    needs: [gate, e2e, workflows-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shikoo_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/shikoo_test
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # `github.repository` is `Shikoonet/Shikoonet-Platform`, and a registry
      # path may not contain uppercase — the OCI distribution spec forbids it,
      # so docker rejects the reference before it ever reaches the network.
      # Lowercased once, here, rather than spelled out as a literal: the
      # owner/repo can be renamed, and this follows it.
      - name: The image path, lowercased
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image that will be deployed
        run: |
          docker buildx build --load --cache-from type=gha \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t "$IMAGE:sha-${{ github.sha }}" .

      # The three gates from `gate`, re-run here because THIS is the image that
      # leaves the runner. Each one's reasoning is written out where it was
      # first added, above — this is the same assertion, not a second policy.
      - name: The gates, against the image being pushed
        run: |
          set -euo pipefail
          img="$IMAGE:sha-${{ github.sha }}"

          out=$(docker run --rm "$img" 2>&1 || true)
          echo "$out" | grep -q 'SERVICE is required'

          dev=$(docker run --rm --entrypoint sh "$img" -c 'ls node_modules/.pnpm | grep -ciE "^(vitest|@vitest|playwright|@playwright|eslint|typescript|@typescript-eslint)@" || true')
          ours=$(docker run --rm --entrypoint sh "$img" -c 'find /app/apps /app/packages \( -name "*.test.ts" -o -name "*.spec.ts" \) | wc -l')
          echo "dev-tooling packages: $dev   our test files: $ours"
          [ "$dev" = "0" ] && [ "$ours" = "0" ]

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c 'CREATE DATABASE behind_by_everything'
          behind="${DATABASE_URL%/*}/behind_by_everything"
          out=$(docker run --rm --network host -e SERVICE=bot -e DATABASE_URL="$behind" "$img" 2>&1 || true)
          echo "$out" | grep -q 'refusing to start'

          # And the label the server will check before it deploys this.
          rev=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$img")
          [ "$rev" = "${{ github.sha }}" ]

      # The tag is for humans reading a registry listing. The DIGEST is the
      # deployment identity, and it is the only thing handed downstream: a tag
      # can be moved, a digest cannot, so «which commit is on the server» stays
      # answerable months later.
      - name: Push, and take the digest
        id: push
        run: |
          set -euo pipefail
          docker push "$IMAGE:sha-${{ github.sha }}"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-${{ github.sha }}")
          digest="sha256:${ref##*@sha256:}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Staging deploys itself. It is the environment that exists to be wrong
  # before production is, so nothing waits for a human here.
  # Development receives every branch, before it is merged. That is the flow:
  # push → see it on shikoo-dev → merge when it is right. Two people share one
  # development environment, so deploys queue (the concurrency group in
  # deploy.yml, never cancelled mid-run) and the last push wins — the cost of
  # one environment, accepted and written down rather than discovered.
  deploy-staging:
    needs: publish
    # `secrets: inherit` is required, and this was learned the hard way: it was
    # removed on the reasoning that the called job declares the environment and
    # so resolves its own environment secrets. That reasoning is wrong. A
    # reusable workflow's `secrets` context is populated by the CALLER — without
    # `inherit` every one of them is the empty string, and the first real deploy
    # failed with `scp: bad port ""`.
    #
    # zizmor flags this as passing more than is needed, and it is right in
    # general. Here there is nothing else to pass: this repository has no
    # repository-level secrets at all, so `inherit` hands over exactly the five
    # environment secrets the deploy needs.
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      digest: ${{ needs.publish.outputs.digest }}
      expected_sha: ${{ github.sha }}
    secrets: inherit # zizmor: ignore[secrets-inherit]

  # Production is a merge to main — through development first, never around it.
  #
  # `needs: deploy-staging` is the gate that used to be a person: this job runs
  # only after the SAME digest — one publish feeds both jobs — has migrated,
  # started, answered its smoke checks and held exactly one poller lock on
  # shikoo-dev. A merge whose development deploy fails never reaches here, and
  # nothing is rebuilt in between, so what production runs is byte-for-byte
  # what development just verified.
  #
  # `PRODUCTION_AUTO_DEPLOY` is the kill-switch for the day real customers are
  # migrated: set the repository variable to `false` and merges stop at
  # development, with promote.yml as the manual approval — no code change, one
  # setting. Until that day this box holds seed data and an automatic deploy
  # costs nothing.
  deploy-production:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_AUTO_DEPLOY == 'true'
    needs: [publish, deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      digest: ${{ needs.publish.outputs.digest }}
      expected_sha: ${{ github.sha }}
    secrets: inherit # zizmor: ignore[secrets-inherit]
