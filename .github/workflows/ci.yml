name: CI

# Required Pull Request quality gate.
#
# `Required Quality Gate` is the ONE check a ruleset should require. Everything
# above it is diagnostic — those names say *why*; this one says *whether*.
#
# ═════════════════════════════════════════════════════════════════════════════
# The shape, and why it changed again on 2026-09-01
#
# The 2026-09-01 restructure (PR #47) stopped paying twenty-one minutes for
# every event there is. It did not get the repository inside the 2,000-minute
# GitHub Free allowance, and measuring the whole of August said why.
#
# Every one of the 292 CI runs in 2026-08-01→09-01 was billed from GitHub's own
# job timestamps. 3,863 minutes for ci.yml, plus 100 for the deploy and
# production workflows. Two facts came out of that, and this file is the
# answer to both:
#
#   1. TWENTY-ONE BILLED MINUTES BUY TWELVE AND A HALF MINUTES OF TESTING.
#      Measured on run 33528524468, per phase, across the nine jobs:
#
#        actual test execution                751s
#        per-job minute rounding              257s  ← nine jobs, nine minimums
#        service container starts             119s  ← four separate Postgres
#        building rhysd/actionlint from source 40s  ← every single run
#        node/pnpm setup, five times            34s
#        checkout, six times                    19s
#        `pnpm install`, five times             13s  ← already cached; 2s each
#
#      `plan` billed a minute for 8 seconds. The gate billed a minute for 15.
#      `unit` billed two for 66. That is the whole of what consolidation
#      recovers, and it is why «install dependencies fewer times» — the obvious
#      lever — was measured and NOT taken: five installs cost thirteen seconds
#      between them, because `setup-node`'s pnpm cache already works.
#
#   2. NINETY-THREE OF THE 133 PUSHES TO `main` WERE DIRECT PUSHES.
#      Not merges. Resolved one at a time against
#      `GET /commits/{sha}/pulls`: 93 direct, 40 from a merged pull request.
#
#      Under PR #47 every one of those 93 was `proven=false` and ran the
#      complete fallback — 23 billed minutes each, 2,139 a month, on commits
#      that `deploy/approval-gate.sh` condition 1 already refuses to deploy.
#      A green tick on a commit that is forbidden to ship, for a fifth of the
#      monthly allowance. See `main-blocked` below.
#
# ═════════════════════════════════════════════════════════════════════════════
# What the shape is now
#
#   checks              classification, then the static half, then the three
#                       suites that need no database. One checkout, one install.
#   integration-db      db:hub, db:services, the migration rehearsal, the money
#                       invariants and the image checks. One Postgres, one
#                       MySQL, one checkout, one install.
#   integration-e2e     the browser walk and the 22 deploy bash suites.
#   image               the deployable artifact. A `main` job only.
#   Required Quality Gate
#
# Five jobs where there were nine, and the two integration executors are split
# the way they are because it was measured rather than guessed. One combined
# executor and two separate ones bill the SAME eleven minutes — 606s in one job
# rounds to 11, and 289s + 359s rounds to 5 + 6 — so the split is free, and it
# buys back four minutes of wall time and keeps a failing database suite from
# delaying the browser walk's result.
#
# What that costs, and it is the one real regression: the integration executors
# now WAIT for `checks`, because GitHub publishes a job's outputs only when the
# job ends. A ready pull request's gate finishes in about nine minutes of wall
# time instead of three and a half. Minutes were the constraint, not latency.
#
# ═════════════════════════════════════════════════════════════════════════════
# What is NOT parallel, and what that changed about the isolation proof
#
# Each database suite used to get its own Postgres CONTAINER on its own runner
# VM, and `system_identifier` — written once by initdb — was the proof in the
# log that two shards were two servers.
#
# They now share one server, so that proof says nothing and has been replaced
# rather than dropped. `tools/ci-integration.sh` creates a fresh DATABASE per
# suite from `template0`, refuses to start unless it is empty, drops it
# afterwards on success and failure alike, and runs the suites SEQUENTIALLY —
# so «its own database» is a complete statement about who can read the rows.
#
# What is genuinely weaker: one postmaster means one crash. A server that dies
# takes the remaining suites with it. That is availability, not isolation, and
# it is the whole price. `--workspace-concurrency=1` is still passed inside
# every suite and every database-backed package still carries
# `fileParallelism: false`; Playwright still runs `workers: 1`.
#
# ═════════════════════════════════════════════════════════════════════════════
# The gate does not trust a green matrix, a skipped job, OR a selected one
#
# Three checks, and the third is new.
#
#   1. Job results against the PLAN. A job the plan said to run must be
#      `success`; a job it said to skip must be `skipped` — not `success`, not
#      `failure`, not `cancelled`. Both directions are mismatches.
#
#   2. Evidence. `tools/ci-verify-gate.ts` reads what every executor uploaded
#      and checks it against `.github/ci-baseline.json`: every expected suite
#      present, no test count down, no skip count up, coverage floors cleared,
#      the Playwright report complete, the migration and invariant counts
#      intact.
#
#   3. Selection. `tools/ci-plan.sh` may now skip suites for a change confined
#      to `apps/`, so the verifier is handed the plan and requires the reported
#      set to equal it EXACTLY. A suite that reported when the plan said it
#      would not is as red as one that is missing. The verifier was NOT taught
#      to tolerate an absence — it was taught to require an exact set, which is
#      the only form of «accept a skip» that cannot be talked into accepting
#      the wrong one.
#
# ═════════════════════════════════════════════════════════════════════════════
# `main`, and the three answers
#
#   main-proven    `tools/ci-main-provenance.sh` proved the complete gate
#                  already passed on this exact tree. The image is rebuilt and
#                  re-verified; no suite re-runs. 3 jobs, 4 billed minutes.
#
#   main-blocked   A DIRECT PUSH — GitHub answered, and no merged pull request
#                  claims the sha. `deploy/approval-gate.sh` condition 1 already
#                  refuses to deploy such a commit, so the gate reports BLOCKED
#                  and no suite runs. That verdict is a FAILURE:
#                  `deploy-staging.yml` starts only on
#                  `workflow_run.conclusion == 'success'`, so this is a second
#                  refusal stacked on the gate's, never a way past it.
#
#                  The cost, stated plainly: a direct push's breakage is not
#                  measured until the next pull request builds on it. It cannot
#                  ship in the meantime, and that pull request runs the complete
#                  gate against a base containing it.
#
#   main-full      Every OTHER way of failing to prove provenance — an
#                  ambiguous association, a red suite on the head, a tree that
#                  moved, an API that would not answer, a pull request that
#                  touched the CI trust surface. Deploy Staging CAN consume
#                  these, so they get the complete gate.
#
# ═════════════════════════════════════════════════════════════════════════════
# Triggers:
#   - pull_request (opened, synchronize, reopened, ready_for_review,
#     converted_to_draft). `ready_for_review` promotes a pull request from Fast
#     Feedback to the complete gate; `converted_to_draft` demotes it, and is
#     present so the demotion cancels the in-flight full run rather than
#     leaving it to finish and bill for it.
#   - merge_group, so it survives GitHub Merge Queue. Always the complete gate.
#   - workflow_dispatch, for re-runs on demand. Always the complete gate.
#   - push to main.
#
# Concurrency:
#   - one running workflow per PR (or per ref for direct pushes). The group is
#     keyed on the PR number for pull_request and on the ref otherwise, so the
#     two namespaces are disjoint and a PR run can never cancel a `main` run or
#     a deployment.
#   - `cancel-in-progress` is true ONLY for pull_request. A `main` validation
#     feeds Deploy Staging, and cancelling one mid-flight would strand it.
#
# Permissions:
#   - default `contents: read` at the workflow level
#   - `checks` is the only job that reads anything beyond the tree, and it reads
#     only. No job in this file can write to the repository, and none holds a
#     deployment secret.
#   - the trigger is `pull_request`, never `pull_request_target`, so a fork's
#     code never runs with a writable token or a secret in scope.
#
# Branch protection:
#   - cannot be enforced on this repo today: `GET /rulesets` and
#     `GET /branches/main/protection` both answer 403 «Upgrade to GitHub Pro».
#     That also rules out a merge queue. The stable aggregator is what a future
#     ruleset should require. Until then the real enforcement is
#     `deploy/approval-gate.sh`, and the manual operating rule:
#
#       NEVER MERGE UNTIL «Required Quality Gate» IS GREEN ON THE EXACT FINAL
#       READY PULL REQUEST HEAD.
#
#     A pull request merged while still a DRAFT is not blocked at merge. What
#     stops it reaching staging untested is `tools/ci-main-provenance.sh`: a
#     draft's green gate sits over a run in which every suite skipped, the proof
#     re-derives the expectation with IS_DRAFT=false and requires those
#     executors to have SUCCEEDED, so it refuses, and `main` runs the complete
#     gate before Deploy Staging can consume anything.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.7
  ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757

jobs:
  # =======================================================================
  # Classification, the static half, and the suites that need no database.
  #
  # `plan` used to be a job of its own. It billed a full minute for eight
  # seconds of work, and it is folded in here because the executors below have
  # to wait for a published output either way — GitHub emits job outputs only
  # when the job ends, so a separate `plan` bought parallelism that this shape
  # cannot use.
  #
  # The classification runs FIRST, in its own step, so its outputs are set even
  # when the static half below goes red. The gate needs the plan in order to
  # say anything, including in order to say that this job failed.
  #
  # actionlint is a pinned BINARY here, verified against its published
  # sha256 — the `rhysd/actionlint` action is a Docker action and building it
  # cost 40 seconds on every run, which is what tipped this job from three
  # billed minutes to four. gitleaks was already installed this way; this is
  # the same pattern, for the same reason.
  # =======================================================================
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Reading only, and only these two. `actions: read` is for the run and
      # job lists the provenance proof consults; `pull-requests: read` is for
      # the merged-PR association and the changed-file list.
      actions: read
      pull-requests: read
    outputs:
      static: ${{ steps.decide.outputs.static }}
      unit: ${{ steps.decide.outputs.unit }}
      db: ${{ steps.decide.outputs.db }}
      e2e: ${{ steps.decide.outputs.e2e }}
      deploy_suites: ${{ steps.decide.outputs.deploy_suites }}
      image: ${{ steps.decide.outputs.image }}
      mode: ${{ steps.decide.outputs.mode }}
      # What this run BELIEVED about the pull request when it planned. The gate
      # compares it against what is true when the gate runs — see «the plan was
      # made for the pull request as it is now».
      is_draft: ${{ steps.draft.outputs.is_draft }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The deny-list diffs against the base, and gitleaks scans the commit
          # range. Both need history.
          fetch-depth: 0

      # ─────────────────────────────────────────────── the plan, first of all
      #
      # Only on a push to main. The proof reads GitHub's own record of what ran
      # and git's own record of what is here — never an artifact, never a job
      # output, nothing a contributor can write.
      - id: provenance
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci-main-provenance.sh "${{ github.repository }}" "${{ github.sha }}"

      # The changed-file list, for the pull_request path only.
      #
      # From the API rather than a diff, so the job needs no extra fetch. Any
      # failure — a rate limit, a 500, a pull request bigger than the pages
      # requested — leaves the file holding the literal `UNKNOWN`, and
      # `ci-plan.sh` runs everything when it reads that.
      - id: changed
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if ! gh api --paginate "repos/${REPO}/pulls/${PR}/files" \
              --jq '.[].filename' >/tmp/changed.txt 2>/tmp/changed.err; then
            echo 'could not list the changed files:'
            cat /tmp/changed.err
            printf 'UNKNOWN\n' >/tmp/changed.txt
          fi
          echo "changed files: $(grep -c . /tmp/changed.txt || printf '0')"
          sed 's/^/  /' /tmp/changed.txt

      # Draft or not — asked, not read off the event.
      #
      # `github.event.pull_request.draft` is a snapshot taken when the event was
      # queued, and a run created LATER can carry an OLDER snapshot. The whole
      # measurement, and why issue #69's guess was wrong, is in
      # `tools/ci-draft-state.sh`; its behaviour is pinned by
      # `tools/test/ci-draft-state.test.sh`, because a check about CI is the one
      # whose bugs are invisible.
      - id: draft
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PAYLOAD_SAID: ${{ github.event.pull_request.draft }}
        run: |
          set -Eeuo pipefail
          now=$(bash tools/ci-draft-state.sh state "$REPO" "$PR")
          if [ "$now" != "$PAYLOAD_SAID" ]; then
            echo "::notice::the event payload said draft=${PAYLOAD_SAID}, the pull request says draft=${now} — planning with ${now}"
          fi
          echo "is_draft=${now}" >>"$GITHUB_OUTPUT"

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          IS_DRAFT: ${{ steps.draft.outputs.is_draft }}
          PROVEN: ${{ steps.provenance.outputs.proven }}
          ASSOCIATION: ${{ steps.provenance.outputs.association }}
        run: |
          set -Eeuo pipefail
          # Through a FILE, never the environment. Linux caps one environment
          # string at 128 KB, and PR #39 changed 3,000 files — 217 KB. Passing
          # that list in `CHANGED_FILES` fails with «Argument list too long»
          # before `ci-plan.sh` runs a single line, so a large pull request
          # could not be classified at all. It failed closed, but it failed.
          export CHANGED_FILES_FILE=/tmp/changed.txt
          bash tools/ci-plan.sh | tee /tmp/plan.txt
          grep -E '^(static|unit|db|e2e|deploy_suites|image|mode)=' /tmp/plan.txt >>"$GITHUB_OUTPUT"

      - name: Say what this run will do
        env:
          MODE: ${{ steps.decide.outputs.mode }}
        run: |
          set -Eeuo pipefail
          {
            echo "## CI plan — \`${MODE}\`"
            echo
            echo "| what | runs |"
            echo "| --- | --- |"
            awk -F= '
              $1 == "static"        { print "| static (typecheck, lint, arch, secrets, actionlint) | " $2 " |" }
              $1 == "unit"          { print "| unit suites (contracts, sms-parser, admin-web) | " $2 " |" }
              $1 == "db"            { print "| integration-db (db shards, migrations, invariants, image) | " $2 " |" }
              $1 == "e2e"           { print "| e2e (browser walk) | " $2 " |" }
              $1 == "deploy_suites" { print "| deploy suites (22 bash suites) | " $2 " |" }
              $1 == "image"         { print "| image (main only) | " $2 " |" }
              $1 == "reason"        { reason = $2 }
              END                   { print ""; print "_" reason "_" }
            ' /tmp/plan.txt
          } >> "$GITHUB_STEP_SUMMARY"

      # ───────────────────────────────────────────────────────── the static half
      #
      # The three script checks run BEFORE the Node setup, because none of them
      # needs `node_modules` and a workflow with a syntax error should say so
      # without waiting for an install it is about to invalidate.
      - name: Install actionlint (pinned release, sha256-verified)
        if: steps.decide.outputs.static == 'true'
        run: |
          set -Eeuo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "$url"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" actionlint
          ./actionlint --version

      - name: shellcheck is present (actionlint uses it for `run:` blocks)
        if: steps.decide.outputs.static == 'true'
        run: shellcheck --version

      - name: actionlint
        if: steps.decide.outputs.static == 'true'
        run: ./actionlint -color

      - name: shellcheck every shipped script
        if: steps.decide.outputs.static == 'true'
        run: |
          set -Eeuo pipefail
          find deploy tools -name '*.sh' -type f -print0 2>/dev/null \
            | xargs -0 --no-run-if-empty shellcheck --external-sources --severity=style

      - name: Install gitleaks (pinned release, sha256-verified)
        if: steps.decide.outputs.static == 'true'
        run: |
          set -Eeuo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "$url"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the working tree
        if: steps.decide.outputs.static == 'true'
        run: |
          set -Eeuo pipefail
          ./gitleaks dir . \
            --config .github/gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1

      - name: Scan the commits this pull request adds
        if: steps.decide.outputs.static == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          ./gitleaks git . \
            --config .github/gitleaks.toml \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --no-banner \
            --exit-code 1

      - name: Project-specific deny-list
        if: steps.decide.outputs.static == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail
          if [ -n "${BASE_REF}" ]; then
            range="origin/${BASE_REF}...HEAD"
          else
            range="HEAD~1...HEAD"
          fi
          echo "range: ${range}"
          denied=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              .notes|.notes/*)
                echo "DENY: ${path} — .notes/ holds the work machine's tokens"
                denied=$((denied + 1))
                ;;
              legacy/mirzabot-php/db|legacy/mirzabot-php/db/*)
                echo "DENY: ${path} — the production dump is git-ignored on purpose"
                denied=$((denied + 1))
                ;;
              sim/.env.local)
                echo "DENY: ${path} — holds the test bot token; git-ignored on purpose"
                denied=$((denied + 1))
                ;;
            esac
          done <<< "$(git diff --name-only "$range" || true)"
          if git diff "$range" | grep -E '^\+' | grep -qE '164\.132\.198\.184'; then
            echo 'DENY: an added line names the practice server by address'
            denied=$((denied + 1))
          fi
          if [ "$denied" -gt 0 ]; then
            echo "::error::${denied} deny-list violation(s)"
            exit 1
          fi
          echo 'deny-list: clean'

      # ──────────────────────────────────── the Node half: types, lint, units
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.decide.outputs.static == 'true' || steps.decide.outputs.unit == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.decide.outputs.static == 'true' || steps.decide.outputs.unit == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.decide.outputs.static == 'true' || steps.decide.outputs.unit == 'true'

      # Exit codes are accumulated across typecheck, lint and arch rather than
      # stopping at the first — a branch that broke all three takes one round
      # trip to find out instead of three.
      - name: typecheck, lint, and the architectural boundaries
        if: steps.decide.outputs.static == 'true'
        run: |
          set -Eeuo pipefail
          worst=0
          echo '::group::typecheck'; pnpm typecheck || worst=$?; echo '::endgroup::'
          echo '::group::lint';      pnpm lint      || worst=$?; echo '::endgroup::'
          echo '::group::arch'
          pnpm exec tsx tools/architecture-boundaries.ts || worst=$?
          echo '::endgroup::'
          exit "$worst"

      - name: No database is reachable from the unit suites
        # The claim they rest on, asserted rather than assumed. If one of these
        # three ever grows a database dependency it fails here with the reason,
        # instead of passing because a connection happened to work.
        if: steps.decide.outputs.unit == 'true'
        run: |
          set -Eeuo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            echo '::error::the unit suites must not carry a DATABASE_URL'
            exit 1
          fi
          echo 'unit suites: no service containers, no DATABASE_URL'

      - name: Pure suites
        if: steps.decide.outputs.unit == 'true'
        run: bash tools/ci-run-tests.sh '@shikoo/admin-web' '@shikoo/contracts @shikoo/sms-parser'

      - name: Upload reports
        if: always() && steps.decide.outputs.unit == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-checks
          # `coverage-summary.json` only — percentages and counts per file. The
          # HTML report embeds the SOURCE, which would put the whole private
          # codebase in a downloadable artifact.
          path: |
            packages/*/vitest-report.json
            apps/*/vitest-report.json
            packages/*/coverage/coverage-summary.json
          retention-days: 3
          if-no-files-found: error

  # =======================================================================
  # The database-backed suites, the migration rehearsal and the image checks.
  #
  # Was four jobs — `unit`'s two database siblings, `db-shard` twice over and
  # `migrations` — costing seven billed minutes and three separate Postgres
  # container starts. One job, one Postgres, one MySQL, one install: 289s.
  #
  # `tools/ci-integration.sh` sequences the three suites, gives each its own
  # freshly created database, drops it afterwards, and runs every one of them
  # even when an earlier one fails — then exits non-zero if any did. See its
  # header for what replaced the `system_identifier` isolation proof.
  # =======================================================================
  integration-db:
    name: integration-db
    needs: checks
    if: needs.checks.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      # The legacy source, for the migration gate. Empty at start; the
      # synthetic fixture is loaded into it. NOT the production dump — that is
      # git-ignored and stays on one machine.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: mirzabot
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pci"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports: ['3307:3306']
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci
      ENV_NAME: test
      MYSQL_HOST: 127.0.0.1
      # 3307, the same host port `sim/docker-compose.yml` uses and the default
      # `loadConfig()` returns — so `config.test.ts`, which asserts that
      # default, is not fighting an override the gate set.
      MYSQL_PORT: '3307'
      MYSQL_USER: root
      MYSQL_PASSWORD: ci
      MYSQL_DATABASE: mirzabot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: db:hub, db:services, migrations
        run: bash tools/ci-integration.sh db-hub db-services migrations

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-integration-db
          path: |
            packages/*/vitest-report.json
            apps/*/vitest-report.json
            packages/*/coverage/coverage-summary.json
            out/schema-counts.json
          retention-days: 3
          if-no-files-found: error

  # =======================================================================
  # The browser walk, and the 22 bash suites over `deploy/`.
  #
  # Was two jobs and seven billed minutes. The deploy suites need no database
  # and no node_modules — they are bash, `jq` and `curl`, driving a fake GitHub
  # and a fake Coolify — so they cost this job nothing but their own 154
  # seconds, and they fill the rounding slack the browser walk leaves behind.
  # =======================================================================
  integration-e2e:
    name: integration-e2e
    needs: checks
    if: needs.checks.outputs.e2e == 'true' || needs.checks.outputs.deploy_suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci
      ENV_NAME: test
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Cached on the resolved playwright version, so the ~130MB chromium
      # download happens once per version bump rather than once per run.
      # `install --with-deps` still runs either way: it is idempotent, and the
      # apt packages it installs are not part of the cached directory.
      - name: Resolve the Playwright version
        if: needs.checks.outputs.e2e == 'true'
        id: playwright
        run: |
          set -Eeuo pipefail
          version=$(pnpm --filter @shikoo/dashboard exec playwright --version | awk '{ print $2 }')
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::could not resolve the playwright version (got '${version}')"; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        if: needs.checks.outputs.e2e == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          # Scoped to this workflow's own runs and invalidated by the version
          # alone: the directory holds vendor browser binaries keyed by that
          # version and nothing this repository produces, so no branch can put
          # anything of its own into it. Deleting it costs a download and
          # changes no result.
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: needs.checks.outputs.e2e == 'true'
        run: pnpm --filter @shikoo/dashboard exec playwright install --with-deps chromium

      - name: The browser walk and the deploy suites
        env:
          WANT_E2E: ${{ needs.checks.outputs.e2e }}
          WANT_DEPLOY: ${{ needs.checks.outputs.deploy_suites }}
        run: |
          set -Eeuo pipefail
          suites=()
          [ "$WANT_E2E" = 'true' ] && suites+=(e2e)
          [ "$WANT_DEPLOY" = 'true' ] && suites+=(deploy-suites)
          # The job's own `if:` guarantees at least one, but a plan that
          # published neither must fail here rather than exit 0 having run
          # nothing at all.
          if [ "${#suites[@]}" -eq 0 ]; then
            echo '::error::this job ran with neither e2e nor deploy_suites selected'
            exit 1
          fi
          bash tools/ci-integration.sh "${suites[@]}"

      # Diagnostics, and only on failure. A trace carries request bodies and
      # rendered pages; `ci-integration.sh` removes `sim/.env.local` and greps
      # the report for the fixture address before this step can reach it.
      - name: Upload Playwright diagnostics
        if: failure() && needs.checks.outputs.e2e == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ github.run_id }}
          path: |
            apps/dashboard-worker/test-results
            apps/dashboard-worker/playwright-report
          # Short, because these carry rendered pages of a seeded shop.
          retention-days: 3
          if-no-files-found: ignore

      # Titles and outcomes only — the json reporter carries no page content,
      # unlike the trace above.
      - name: Upload the Playwright result count
        if: always() && needs.checks.outputs.e2e == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-integration-e2e
          path: apps/dashboard-worker/playwright-report.json
          retention-days: 3
          if-no-files-found: error

  # =======================================================================
  # The deployable artifact, on `main` and only on `main`.
  #
  # The same three checks `integration-db` runs on a pull request — one script,
  # `tools/ci-image-checks.sh`, so there is one copy of them rather than two.
  #
  # It runs on every push to main that is proven or full, and that is not
  # redundant with the pull request having run them on the identical tree. A
  # docker build is the one thing here that is not hermetic: `FROM` resolves
  # against a registry and `apt` against a mirror, so the same tree can produce
  # a different image today than it did yesterday. This is the check that sees
  # that, on the exact commit Deploy Staging is about to build for real.
  #
  # No `pnpm install`, no node_modules, no migrations: a Postgres and a docker.
  # The database is an EMPTY one — the schema-mismatch check makes its own.
  # =======================================================================
  image:
    name: image
    needs: checks
    if: needs.checks.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shikoo_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/shikoo_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The image, measured rather than described
        run: bash tools/ci-image-checks.sh

  # =======================================================================
  # Stable final aggregator.
  #
  # Reports PASS only when every required job did EXACTLY what the plan said it
  # would, AND every executor that ran left behind the evidence that it ran what
  # it claims. Runs `if: always()` so a cancelled earlier job still produces an
  # explicit verdict — the ruleset, when it exists, sees one check, not a forest
  # of pending ones.
  #
  # Four halves, and the fourth is new:
  #
  #   1. Job results, against the PLAN. `success` for every job the plan said to
  #      run; `skipped` — exactly `skipped` — for every job it said not to. A
  #      job that ran when the plan said it would not is as much a mismatch as
  #      one that did not run when it should have.
  #
  #   2. `checks` itself must have succeeded. If it did not, nothing below it
  #      can be trusted to have made a decision at all.
  #
  #   3. Evidence. `tools/ci-verify-gate.ts` reads what every executor uploaded
  #      and checks it against `.github/ci-baseline.json`, handed the plan so it
  #      requires the reported set to equal the expected set exactly.
  #
  #   4. `main-blocked` is a FAILURE, said out loud. A direct push to main
  #      cannot be deployed by `deploy/approval-gate.sh`, so this workflow does
  #      not spend the complete gate proving something about a commit that is
  #      already forbidden to ship — but it must not report success either.
  # =======================================================================
  Required-Quality-Gate:
    name: Required Quality Gate
    runs-on: ubuntu-latest
    needs: [checks, integration-db, integration-e2e, image]
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The belt to `checks`' braces, and it covers a window that one cannot.
      #
      # `checks` asks the API when it plans, so a run STARTED after «Ready» sees
      # it. A pull request marked Ready while this run is already going is a
      # different case: the plan was honest when it was made, the fast gate has
      # already been spent, and the green that lands is still a draft's green on
      # a Ready pull request. Nothing creates a new run for that, so the only
      # place it can be caught is here, at the end.
      #
      # Red rather than a warning. `ci.yml`'s own instruction is «NEVER MERGE
      # UNTIL Required Quality Gate IS GREEN ON THE EXACT FINAL READY HEAD», and
      # a rule that has to be remembered by a person is the one `tools/
      # ci-main-provenance.sh` currently catches a merge too late — at the cost
      # of a burnt merge and a red `main`.
      - name: The plan was made for the pull request as it is now
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLANNED_DRAFT: ${{ needs.checks.outputs.is_draft }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if bash tools/ci-draft-state.sh assert-fresh "${PLANNED_DRAFT:-}" "$REPO" "$PR"; then
            exit 0
          fi
          echo "::error::This run planned as a DRAFT and the pull request is Ready now."
          echo "::error::integration-db and integration-e2e were skipped, so this green is the fast gate's."
          {
            echo "## Required Quality Gate — STALE"
            echo
            echo "This run planned with \`IS_DRAFT=true\`, so the complete gate was never spent"
            echo "on \`${GITHUB_SHA}\`. The pull request is Ready now, and a green here would"
            echo "read as the complete gate having passed."
            echo
            echo "Push the branch again, or re-run this workflow, so one run plans and tests"
            echo "the same pull request."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Every job did exactly what the plan said
        env:
          CHECKS: ${{ needs.checks.result }}
          MODE: ${{ needs.checks.outputs.mode }}
          WANT_DB: ${{ needs.checks.outputs.db }}
          WANT_E2E: ${{ needs.checks.outputs.e2e }}
          WANT_DEPLOY: ${{ needs.checks.outputs.deploy_suites }}
          WANT_IMAGE: ${{ needs.checks.outputs.image }}
          DB: ${{ needs.integration-db.result }}
          E2E: ${{ needs.integration-e2e.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          set -Eeuo pipefail

          bad=0
          : >/tmp/rows.md

          # A job the plan said to run must be `success`. A job the plan said
          # NOT to run must be `skipped` — nothing else, in either direction.
          check() { # label  wanted(true|false)  result
            local label=$1 want=$2 got=$3 verdict
            if [ "$want" = 'true' ]; then
              if [ "$got" = 'success' ]; then verdict='ok'; else
                verdict='WRONG'
                echo "::error::${label}: the plan said run, the job reported '${got}'"
                bad=$((bad + 1))
              fi
            else
              if [ "$got" = 'skipped' ]; then verdict='ok (planned skip)'; else
                verdict='WRONG'
                echo "::error::${label}: the plan said skip, the job reported '${got}'"
                bad=$((bad + 1))
              fi
            fi
            printf '| %s | %s | %s | %s |\n' "$label" "$want" "$got" "$verdict" >>/tmp/rows.md
          }

          if [ "$CHECKS" != 'success' ]; then
            echo "::error::checks reported '${CHECKS}' — no decision was published, so nothing below it can be believed"
            bad=$((bad + 1))
          fi

          # A direct push to main. Not tested, because it cannot be deployed —
          # and therefore not green either.
          if [ "$MODE" = 'main-blocked' ]; then
            echo "::error::BLOCKED — this is a direct push to main, not a merged pull request."
            echo "::error::deploy/approval-gate.sh refuses to deploy it, so the complete gate was not spent on it."
            echo "::error::Open a pull request; its gate is what makes a tree deployable."
            {
              echo "## Required Quality Gate — BLOCKED"
              echo
              echo "\`${GITHUB_SHA}\` was pushed directly to \`main\`."
              echo
              echo "No merged pull request claims it, so \`deploy/approval-gate.sh\` condition 1"
              echo "already refuses to deploy it. The complete gate was not run, and this check"
              echo "is red rather than green: \`deploy-staging.yml\` starts only on a **successful**"
              echo "CI run, so nothing can ship from here."
              echo
              echo "Open a pull request for this change. Its gate is what makes a tree deployable."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # An empty output means `checks` never published one. Treated as
          # «should have run» so a job that was skipped against an empty plan
          # is a mismatch and the gate is red — the fail-closed direction.
          want_e2e_job=true
          if [ "${WANT_E2E:-true}" = 'false' ] && [ "${WANT_DEPLOY:-true}" = 'false' ]; then
            want_e2e_job=false
          fi

          check 'integration-db'  "${WANT_DB:-true}"    "$DB"
          check 'integration-e2e' "$want_e2e_job"       "$E2E"
          check 'image'           "${WANT_IMAGE:-true}" "$IMAGE"

          {
            echo "## Required Quality Gate — plan \`${MODE:-unknown}\`"
            echo
            echo "| job | planned | result | |"
            echo "| --- | --- | --- | --- |"
            printf '| checks | true | %s | %s |\n' "$CHECKS" \
              "$([ "$CHECKS" = 'success' ] && echo ok || echo WRONG)"
            cat /tmp/rows.md
            echo
            echo "Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$bad" -eq 0 ]

      # `reports-*` only. The Playwright failure artifact carries traces of
      # rendered pages and is megabytes; nothing here reads it.
      #
      # Only when at least one suite ran — there is no report to download
      # otherwise, and `download-artifact` fails on a pattern that matches
      # nothing, which would be the right verdict for the wrong reason.
      - name: Collect every executor's report
        if: needs.checks.outputs.unit == 'true' || needs.checks.outputs.db == 'true' || needs.checks.outputs.e2e == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ci-reports
          pattern: 'reports-*'

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: needs.checks.outputs.unit == 'true' || needs.checks.outputs.db == 'true' || needs.checks.outputs.e2e == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.checks.outputs.unit == 'true' || needs.checks.outputs.db == 'true' || needs.checks.outputs.e2e == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.checks.outputs.unit == 'true' || needs.checks.outputs.db == 'true' || needs.checks.outputs.e2e == 'true'

      - name: Every suite that ran left the evidence that it ran
        # Not conditional on the results step above: when a suite fails, its
        # report still names which tests failed, and printing that beside the
        # red job result is worth more than a second «a job failed».
        if: always() && (needs.checks.outputs.unit == 'true' || needs.checks.outputs.db == 'true' || needs.checks.outputs.e2e == 'true')
        env:
          PLAN_UNIT: ${{ needs.checks.outputs.unit }}
          PLAN_DB: ${{ needs.checks.outputs.db }}
          PLAN_E2E: ${{ needs.checks.outputs.e2e }}
        run: pnpm exec tsx tools/ci-verify-gate.ts ci-reports

      - name: Say why the baseline was not checked
        # Said out loud rather than silently omitted. A run that verified no
        # test counts should say so on its own summary, so «green» is never
        # mistaken for «the suite passed» when the suite did not run.
        if: needs.checks.outputs.unit != 'true' && needs.checks.outputs.db != 'true' && needs.checks.outputs.e2e != 'true'
        env:
          MODE: ${{ needs.checks.outputs.mode }}
        run: |
          set -Eeuo pipefail
          {
            echo
            echo "### The test baseline was NOT checked on this run"
            echo
            case "$MODE" in
              main-proven)
                echo "\`main\`, and \`tools/ci-main-provenance.sh\` proved this tree already"
                echo "passed the complete gate as a pull request. The image was rebuilt and"
                echo "re-verified; no test was re-run, because none could reach a new answer."
                ;;
              fast)
                echo "Draft pull request — fast feedback only. Mark it Ready for Review to run"
                echo "the complete gate. A draft merged anyway does NOT reach staging on this"
                echo "green: \`tools/ci-main-provenance.sh\` re-derives the expectation with"
                echo "IS_DRAFT=false and requires those executors to have succeeded, so \`main\`"
                echo "runs the complete gate instead."
                ;;
              docs)
                echo "Every changed path is documentation. No suite could observe the change."
                ;;
              *)
                echo "Mode \`${MODE:-unknown}\`."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        run: |
          echo "Required Quality Gate: success" >> "$GITHUB_STEP_SUMMARY"
