# The three app services, one file, two environments.
#
# This file owns bot, ingest and dashboard — Coolify keeps its panel and the
# Postgres resources (and their backups). One compose file serves both
# environments because the only differences are values, not shape: the project
# name (`-p shikoo-staging` / `-p shikoo-production`, chosen by
# deploy/host/deploy.sh), the network, the env directory and the image. Two
# copies of this file would be two copies drifting apart.
#
# Every variable uses `:?` so a bare `docker compose up` fails loudly instead
# of deploying an image nobody named. Same reasoning as SERVICE and ENV_NAME
# having no default: a setting nobody decided is refused, not guessed.
#
# `SHIKOO_IMAGE` is always a registry DIGEST (ghcr.io/…@sha256:…), never a
# tag. The digest is the deployment identity; tags are pointers for humans.
#
# `SOURCE_COMMIT` used to be injected by Coolify (docs/STATUS.md, 2026-08-22 —
# read from a live container and matched the image tag). Under compose the
# deploy script injects it, full 40-char sha, and the smoke test reads it back
# from `GET /version` to prove the running code is the deployed commit.
#
# No ports are published. The bot polls outward and listens on nothing; ingest
# and dashboard are reached only through the network aliases below — the same
# aliases shikoo-tls's nginx resolves via 127.0.0.11. There is no firewall on
# this host (docs/threat-model.md), so a published port is a public port; the
# deploy script asserts after every deploy that none appeared.
#
# No healthcheck blocks: the image carries its own HEALTHCHECK that branches on
# SERVICE (Dockerfile), and a second definition here would drift from it.
#
# No depends_on: ordering is the deploy script's job (migrate → ingest and
# dashboard → bot last, the order docs/STATUS.md proved on a real deploy), and
# depends_on would fight it.
#
# No container_name: compose's own <project>-<service>-1 names are stable,
# which is the property every hardcoded Coolify container name lacked.

name: shikoo # overridden by -p; present so a bare `compose config` has one

networks:
  default:
    name: ${SHIKOO_NETWORK:?set by deploy.sh from /etc/shikoo/<env>/deploy.env}
    external: true

services:
  # Never started by `up -d` (profile). Run as a one-off:
  #   docker compose … run --rm migrate
  # It applies pending migrations under the schema advisory lock and exits.
  # Reuses dashboard.env because all it reads is DATABASE_URL.
  migrate:
    profiles: [migrate]
    image: ${SHIKOO_IMAGE:?the registry digest to deploy, ghcr.io/…@sha256:…}
    environment:
      SERVICE: migrate
    env_file: ${SHIKOO_ENV_DIR:?set by deploy.sh, /etc/shikoo/<env>}/dashboard.env
    restart: "no"

  bot:
    image: ${SHIKOO_IMAGE:?}
    environment:
      SERVICE: bot
      SOURCE_COMMIT: ${SOURCE_COMMIT:?full 40-char sha of the deployed commit}
    env_file: ${SHIKOO_ENV_DIR:?}/bot.env
    restart: unless-stopped

  ingest:
    image: ${SHIKOO_IMAGE:?}
    environment:
      SERVICE: ingest
      SOURCE_COMMIT: ${SOURCE_COMMIT:?}
    env_file: ${SHIKOO_ENV_DIR:?}/ingest.env
    restart: unless-stopped
    networks:
      default:
        aliases: [ingest]

  dashboard:
    image: ${SHIKOO_IMAGE:?}
    environment:
      SERVICE: dashboard
      SOURCE_COMMIT: ${SOURCE_COMMIT:?}
    env_file: ${SHIKOO_ENV_DIR:?}/dashboard.env
    restart: unless-stopped
    networks:
      default:
        aliases: [dashboard]
